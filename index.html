// Format số chấp dạng phân số (¼ ½ ¾...) — dùng cho mọi nơi cần hiển thị handicap
function fmtHCGlobal(v){
  if(v===0)return'0';
  const abs=Math.abs(v);
  const frac={0.25:'¼',0.5:'½',0.75:'¾',1.25:'1¼',1.5:'1½',1.75:'1¾',2.5:'2½'};
  const base=frac[Math.round(abs*100)/100]||String(abs);
  return(v>0?'+':'')+base;
}
// Lịch sử đối đầu trực tiếp (Head-to-Head) giữa 2 đội, không tính trận hiện tại, mới nhất trước
// Trả về tối đa n trận gần nhất đã có kết quả: {date, team1, team2, score1, score2, winner: teamName|'draw'}
function getH2HHistory(teamA, teamB, excludeMatchId, n=5){
  return S.matches.filter(m=>
    m.id!==excludeMatchId &&
    ((m.team1===teamA&&m.team2===teamB)||(m.team1===teamB&&m.team2===teamA)) &&
    m.score1!=null && m.score2!=null
  ).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,n).map(m=>{
    const s1=Number(m.score1),s2=Number(m.score2);
    let winner='draw';
    if(s1!==s2) winner=s1>s2?m.team1:m.team2;
    return{date:m.date,team1:m.team1,team2:m.team2,score1:s1,score2:s2,winner};
  });
}
// Lịch sử đối đầu 1vs1 (Đối đầu) giữa 2 USER cụ thể — không tính lượt đối đầu của trận hiện tại,
// chỉ tính các lượt đã 'accepted' và trận đã có kết quả (đã ngã ngũ thắng/thua/hòa kèo).
// Trả về tối đa n lượt gần nhất, mới nhất trước:
// {matchId, date, team1, team2, score1, score2, outcome:'winA'|'winB'|'push', uidA, uidB}
function getUserVsUserDuelHistory(uidA, uidB, excludeMatchId, n=8){
  if(!S.duels)return[];
  return Object.values(S.duels).filter(d=>
    d.matchId!==excludeMatchId &&
    d.status==='accepted' &&
    ((d.fromUid===uidA&&d.toUid===uidB)||(d.fromUid===uidB&&d.toUid===uidA))
  ).map(d=>{
    const m=S.matches.find(x=>x.id===d.matchId);if(!m)return null;
    if(!getResult(m))return null; // chưa có kết quả
    const outcome=resolveDuelOutcome(d);
    let result;
    if(!outcome) result='push'; // cả 2 đoán sai → hòa kèo, không ai thắng/thua đối đầu
    else result=outcome.winnerId===uidA?'winA':'winB';
    return{
      matchId:d.matchId,date:m.date,team1:m.team1,team2:m.team2,
      score1:m.score1,score2:m.score2,outcome:result,uidA,uidB
    };
  }).filter(Boolean).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,n);
}
// Thống kê thắng/thua/hòa kèo CỦA RIÊNG uidA khi đối đầu với uidB (và ngược lại)
// Trả về góc nhìn của uidA: {winsA, winsB, pushes, total}
function calcDuelRecordVs(uidA, uidB){
  const hist=getUserVsUserDuelHistory(uidA, uidB, null, Infinity);
  let winsA=0, winsB=0, pushes=0;
  hist.forEach(h=>{
    if(h.outcome==='winA')winsA++;
    else if(h.outcome==='winB')winsB++;
    else pushes++;
  });
  return{winsA,winsB,pushes,total:hist.length};
}
// Chuỗi thắng (đoán đúng liên tiếp) hoặc thua (đoán sai liên tiếp) hiện tại của 1 người chơi
// Trả về {type:'win'|'loss'|'none', count}
function getUserWinLossStreak(uid){
  const w=calcStreak(uid);
  if(w>0) return{type:'win',count:w};
  const l=calcLossStreak(uid);
  if(l>0) return{type:'loss',count:l};
  return{type:'none',count:0};
}
// Xác định người thắng/thua của 1 cặp đối đầu đã accepted cho 1 trận đã có kết quả
// Trả về null nếu chưa có kết quả hoặc hòa kèo (cả 2 đều sai → không tính)
function resolveDuelOutcome(d){
  const m=S.matches.find(x=>x.id===d.matchId);if(!m)return null;
  const res=getResult(m);if(!res)return null;
  const p1=(S.predictions[d.fromUid]||{})[d.matchId];
  const p2=(S.predictions[d.toUid]||{})[d.matchId];
  if(!p1||!p2)return null;
  const c1=p1.choice===res,c2=p2.choice===res;
  if(c1===c2)return null; // cả 2 đúng (không thể, vì chọn khác nhau) hoặc cả 2 sai → không tính thắng/thua
  return{winnerId:c1?d.fromUid:d.toUid,loserId:c1?d.toUid:d.fromUid};
}
// Lượt đối đầu (accepted) của user cho 1 trận cụ thể — dùng trong tính điểm
function getAcceptedDuelForUserMatch(uid,mid){
  if(!S.duels)return null;
  return Object.values(S.duels).find(d=>d.matchId===mid&&d.status==='accepted'&&(d.fromUid===uid||d.toUid===uid))||null;
}
// Tổng tỷ số thắng/thua đối đầu 1vs1 của 1 user (trên các trận đã có kết quả)
function calcDuelRecord(uid){
  if(!S.duels)return{wins:0,losses:0,pushes:0,total:0};
  let wins=0,losses=0,pushes=0,total=0;
  Object.values(S.duels).forEach(d=>{
    if(d.status!=='accepted')return;
    if(d.fromUid!==uid&&d.toUid!==uid)return;
    const m=S.matches.find(x=>x.id===d.matchId);if(!m)return;
    if(!getResult(m))return; // chưa có kết quả
    total++;
    const outcome=resolveDuelOutcome(d);
    if(!outcome){pushes++;return;}
    if(outcome.winnerId===uid)wins++;else losses++;
  });
  return{wins,losses,pushes,total};
}
// Lượt đối đầu "hiện hành" để hiển thị banner trên Bảng XH:
// Ưu tiên trận có ngày gần "bây giờ" nhất (đã/đang diễn ra gần nhất, hoặc sắp diễn ra gần nhất nếu chưa có trận nào diễn ra)
// và vẫn được giữ hiển thị cho đến khi xuất hiện đối đầu của 1 trận khác.
function getCurrentDuelForLeaderboard(){
  if(!S.duels)return null;
  const accepted=Object.values(S.duels).filter(d=>d.status==='accepted');
  if(!accepted.length)return null;
  const now=Date.now();
  const withMatch=accepted.map(d=>({d,m:S.matches.find(x=>x.id===d.matchId)})).filter(x=>x.m);
  if(!withMatch.length)return null;
  // Trận đã/đang diễn ra (date <= now), lấy gần nhất; nếu không có thì lấy trận sắp diễn ra gần nhất
  const started=withMatch.filter(x=>new Date(x.m.date).getTime()<=now).sort((a,b)=>new Date(b.m.date)-new Date(a.m.date));
  if(started.length)return started[0];
  const upcoming=withMatch.sort((a,b)=>new Date(a.m.date)-new Date(b.m.date));
  return upcoming[0];
}

// ─── BRACKET RESOLVER: fills team names into knockout matches ───
// Returns a map of matchId → {team1, team2} resolved from results
function resolveKnockout(){
  const res={};

  // Helper: get winner/loser of a match by id
  const mById=id=>S.matches.find(x=>x.id===id);
  const winner=m=>{
    if(!m||m.score1===null)return null;
    // 90' phân thắng bại → dùng luôn
    if(m.score1>m.score2)return m.team1;
    if(m.score2>m.score1)return m.team2;
    // 90' hòa → xét tỷ số sau 120' (hiệp phụ) nếu đã nhập
    if(m.scoreET1!==null&&m.scoreET1!==undefined&&m.scoreET2!==null&&m.scoreET2!==undefined){
      if(m.scoreET1>m.scoreET2)return m.team1;
      if(m.scoreET2>m.scoreET1)return m.team2;
    }
    // 120' vẫn hòa (hoặc chưa nhập) → dùng kết quả luân lưu penalty
    return m.penWinner||null;
  };
  const loser=m=>{
    const w=winner(m);if(!w)return null;
    return w===m.team1?m.team2:m.team1;
  };

  // ─ Round of 32 (match ids 73-88) ─
  // Tên đội đã CỐ ĐỊNH trong genMatches() (lịch chính thức) → không cần resolve động nữa.
  // Giữ nguyên tên đội gốc của trận (m.team1/m.team2) thay vì override bằng r32Slots.

  // ─ Round of 16 (match ids 89-96) ─
  // W M73 vs W M75, W M74 vs W M77, W M76 vs W M78, W M79 vs W M80
  // W M83 vs W M84, W M81 vs W M82, W M86 vs W M88, W M85 vs W M87
  const r16Pairs=[[89,74,77],[90,73,75],[91,76,78],[92,79,80],[93,83,84],[94,81,82],[95,86,88],[96,85,87]];
  r16Pairs.forEach(([rid,m1id,m2id])=>{
    const m1=mById(m1id),m2=mById(m2id);
    const w1=winner(m1),w2=winner(m2);
    res[rid]={
      team1:w1||'W '+(m1?m1.team1:'M'+m1id)+'/'+(m1?m1.team2:''),
      team2:w2||'W '+(m2?m2.team1:'M'+m2id)+'/'+(m2?m2.team2:''),
    };
  });

  // ─ QF (match ids 97-100) ─
  const qfPairs=[[97,89,90],[98,93,94],[99,91,92],[100,95,96]];
  qfPairs.forEach(([rid,m1id,m2id])=>{
    const m1=mById(m1id),m2=mById(m2id);
    const w1=winner(m1),w2=winner(m2);
    res[rid]={team1:w1||'W R16 #'+(rid-96),team2:w2||'W R16 #'+(rid-95)};
  });

  // ─ SF (match ids 101-102) ─
  [[101,97,98],[102,99,100]].forEach(([rid,m1id,m2id])=>{
    const m1=mById(m1id),m2=mById(m2id);
    res[rid]={team1:winner(m1)||'W QF #'+(rid-100),team2:winner(m2)||'W QF #'+(rid-99)};
  });

  // ─ 3rd place (103) & Final (104) ─
  const sf1=mById(101),sf2=mById(102);
  res[103]={team1:loser(sf1)||'SF Loser 1',team2:loser(sf2)||'SF Loser 2'};
  res[104]={team1:winner(sf1)||'SF Winner 1',team2:winner(sf2)||'SF Winner 2'};

  return res;
}

// Nhận diện tên đội còn là "placeholder" (chưa xác định đội thật) — các mẫu do genMatches()
// sinh ra cho vòng knockout: "W M74", "W R16 #1", "W QF #1", "SF Winner 1", "SF Loser 1"...
function isPlaceholderTeamName(name){
  return typeof name==='string' && /^(W |SF )/.test(name.trim());
}
// Get display name for a match team slot.
// ƯU TIÊN TUYỆT ĐỐI tên đội thật sự lưu trong m.team1/m.team2 (kể cả khi admin sửa tay
// trực tiếp trên Firebase) — bracket tự tính (winner trận trước) CHỈ được dùng để tự động
// điền tên khi ô đó vẫn còn là placeholder (chưa ai xác định đội thật).
function getMatchTeam(m,slot,bracket){
  const raw=slot===1?m.team1:m.team2;
  if(!isPlaceholderTeamName(raw))return raw; // admin đã set tên thật → dùng luôn, không override
  const b=bracket&&bracket[m.id];
  if(b){
    const bn=slot===1?b.team1:b.team2;
    if(bn)return bn;
  }
  return raw;
}

// Save to Firebase (non-blocking)
function fbSave(path, data){
  if(!window._fb)return;
  const {db,ref,set}=window._fb;
  set(ref(db,path),data).catch(e=>console.warn('FB write err:',e));
}
// Kiểm tra xem thiết bị có đang thực sự kết nối được tới Firebase hay không.
// Kết hợp cả navigator.onLine (mạng vật lý) lẫn window._fbConnected (kênh
// realtime tới server) để tránh trường hợp wifi báo "online" nhưng không
// thực sự tới được internet/Firebase.
function isFbConnected(){
  if(typeof navigator!=='undefined' && navigator.onLine===false) return false;
  return !!(window._fb && window._fbConnected===true);
}
// Ghi lên Firebase và CHỜ xác nhận ghi thành công (trả về true/false) thay vì
// ghi kiểu "bắn rồi quên" như fbSave(). Dùng cho các thao tác quan trọng cần
// đảm bảo dữ liệu đã thực sự lên server trước khi coi hành động là hoàn tất
// (ví dụ: quay Kim Bài Miễn Tử).
function fbSaveConfirmed(path, data){

// Sanitize matches: normalize score1/score2 to null if undefined/missing
function sanitizeMatches(arr){
  if(!Array.isArray(arr))return arr;
  return arr.map(m=>({
    ...m,
    score1:(m.score1===undefined||m.score1==='')?null:m.score1,
    score2:(m.score2===undefined||m.score2==='')?null:m.score2,
    handicap1:m.handicap1||0,
    handicap2:m.handicap2||0,
    penWinner:m.penWinner||null,
    scoreET1:(m.scoreET1===undefined||m.scoreET1==='')?null:m.scoreET1,
    scoreET2:(m.scoreET2===undefined||m.scoreET2==='')?null:m.scoreET2,
  }));
}
// Load shared data from Firebase and merge into S
function fbLoadShared(cb){
  if(!window._fb){cb&&cb();return;}
  const {db,ref,get}=window._fb;
  get(ref(db,'/')).then(snap=>{
    if(snap.exists()){
      const d=snap.val();
      if(d.users){
        const fbUsers=Object.values(d.users);
        const adminLocal=S.users.find(u=>u.isAdmin);
        const fbAdm=fbUsers.find(u=>u.isAdmin)||adminLocal;
        S.users=[fbAdm,...fbUsers.filter(u=>!u.isAdmin)];
      }
      if(d.predictions) S.predictions=d.predictions;
      if(d.matches){
        const raw=Array.isArray(d.matches)?d.matches:Object.values(d.matches).sort((a,b)=>a.id-b.id);
        S.matches=sanitizeMatches(raw); invalidateMatchCache(); invalidateBracketCache();
      }
      if(d.stars) S.stars=d.stars;
      if(d.starUsed) S.starUsed=d.starUsed;
      if(d.shields) S.shields=d.shields;
      if(d.shieldUsed) S.shieldUsed=d.shieldUsed;
      if(d.shieldCosts) S.shieldCosts=d.shieldCosts;
      if(d.blessings) S.blessings=d.blessings;
      if(d.kbmt) S.kbmt=d.kbmt;
      if(d.duels) S.duels=d.duels;
      saveLocal();
    }
    cb&&cb();
  }).catch(e=>{console.warn('FB load err:',e);cb&&cb();});
}
// Subscribe to real-time leaderboard/predictions updates
// NOTE: We intentionally do NOT subscribe to /matches in real-time to prevent
// overwriting admin-entered scores. Matches are only loaded once at init.
let _fbIgnoreMatchUpdate=false; // guard flag for admin saves
let _fbIgnorePredUpdate=false;  // guard flag: bỏ qua echo Firebase ngay sau khi user tự lưu prediction
function fbSubscribeLB(){
  if(!window._fb)return;
  const {db,ref,onValue}=window._fb;
  onValue(ref(db,'/users'),snap=>{
    if(!snap.exists())return;
    const fbUsers=Object.values(snap.val());
    const adminLocal=S.users.find(u=>u.isAdmin);
    S.users=[adminLocal,...fbUsers.filter(u=>!u.isAdmin)];
    saveLocal();
    if(page==='leaderboard')render();
  });
  onValue(ref(db,'/predictions'),snap=>{
    if(!snap.exists())return;
    if(_fbIgnorePredUpdate)return; // User vừa lưu prediction — bỏ qua echo để tránh race condition
    S.predictions=snap.val();
    saveLocal();
    if(page==='leaderboard'||page==='matches')render();
  });  // Lịch thi đấu (matches) được ĐỌC real-time từ Firebase tại đây — đây là nguồn dữ
  // liệu duy nhất cho phần lịch thi đấu, không tự sinh/sắp lại ở client.
  // Chỉ bỏ qua cập nhật khi: (a) vừa admin tự ghi (_fbIgnoreMatchUpdate) để tránh giật
  // lại dữ liệu cũ do độ trễ, hoặc (b) admin đang mở form chỉnh sửa trận đấu, để không
  // bị ghi đè giữa chừng khi đang gõ tỷ số.
  onValue(ref(db,'/matches'),snap=>{
    if(!snap.exists())return;
    if(_fbIgnoreMatchUpdate)return; // Admin just saved, skip this echo
    const cu=S.users.find(x=>x.id===S.session);
    if(cu&&cu.isAdmin)return; // Never overwrite matches while admin is active
    const fbMatches=snap.val();
    const raw=Array.isArray(fbMatches)?fbMatches:Object.values(fbMatches).sort((a,b)=>a.id-b.id);
    S.matches=sanitizeMatches(raw); invalidateMatchCache(); invalidateBracketCache();
    saveLocal();
  });
  onValue(ref(db,'/duels'),snap=>{
    S.duels=snap.exists()?snap.val():{};
    saveLocal();
    if(page==='leaderboard'||page==='matches'||page==='profile')render();
  });
}

// ════════════════ CROWN SYSTEM — nhận diện Top 1 của 3 bảng xếp hạng ════════════════
// 1. Lãnh Tụ Tối Cao (điểm số cao nhất) · 2. Hiệp Sĩ (đối kháng nhiều thắng nhất) · 3. Thiên Nhãn (dự đoán đúng nhiều nhất)
const CROWN_CFG={
  leader:{icon:'👑',label:'Lãnh Tụ Tối Cao',color:'#FFD700',glow:'rgba(255,185,0,.85)',font:"'Bebas Neue',sans-serif"},
  warrior:{icon:'🔱',label:'Hiệp Sĩ',color:'#FF2D2D',glow:'rgba(255,45,45,.75)',font:"'Bebas Neue',sans-serif"},
  seer:{icon:'🔮',label:'Thiên Nhãn',color:'#00CFFF',glow:'rgba(0,200,255,.75)',font:"'Bebas Neue',sans-serif"},
};
const CROWN_ORDER=['leader','warrior','seer']; // thứ tự ưu tiên hiển thị khi 1 user giữ nhiều vương miện
let _crownCache=null;
function invalidateCrownCache(){ _crownCache=null; }
// Trả về {leader:uid|null, warrior:uid|null, seer:uid|null} — luôn lấy người đứng đầu mỗi bảng (kể cả 0 điểm/0 trận)
function getCrownHolders(){
  if(_crownCache)return _crownCache;
  const players=S.users.filter(x=>!x.isAdmin);
  const res={leader:null,warrior:null,seer:null};
  if(players.length){
    // Lãnh Tụ Tối Cao: điểm cao nhất
    res.leader=[...players].sort((a,b)=>(b.points||0)-(a.points||0))[0].id;
    // Hiệp Sĩ: đối kháng — thắng nhiều nhất, tie-break winRate rồi total
    const recs=players.map(p=>{const dr=calcDuelRecord(p.id);return{id:p.id,wins:dr.wins,total:dr.total};});
    recs.sort((a,b)=>{
      if(b.wins!==a.wins)return b.wins-a.wins;
      const rA=a.total===0?1:a.wins/a.total, rB=b.total===0?1:b.wins/b.total;
      if(rB!==rA)return rB-rA;
      return b.total-a.total;
    });
    res.warrior=recs[0].id;
    // Thiên Nhãn: số dự đoán đúng nhiều nhất, tie-break tỷ lệ đúng
    const seers=players.map(p=>{
      const pr=S.predictions[p.id]||{};
      const cor=Object.values(pr).filter(x=>{const m=S.matches.find(y=>y.id===x.matchId);return m&&getResult(m)===x.choice;}).length;
      const tot=Object.keys(pr).length;
      return{id:p.id,cor,tot};
    });
    seers.sort((a,b)=>b.cor-a.cor||(b.cor/Math.max(b.tot,1))-(a.cor/Math.max(a.tot,1)));
    res.seer=seers[0].id;
  }
  _crownCache=res;
  return res;
}
// Danh sách config vương miện (theo thứ tự ưu tiên) mà 1 user đang giữ
function getCrownsForUser(uid){
  if(!uid)return[];
  const holders=getCrownHolders();
  return CROWN_ORDER.filter(k=>holders[k]===uid).map(k=>({key:k,...CROWN_CFG[k]}));
}

// Cache getStatus per render cycle — mỗi trận chỉ tính 1 lần
let _statusCache={};
let _statusCacheTime=0;
function getStatus(ds){
  const now=Date.now();
  // Reset cache mỗi 30s hoặc khi render mới (phát hiện qua thay đổi thời gian > 1s)
  if(now-_statusCacheTime>1000){_statusCache={};_statusCacheTime=now;}
  if(ds in _statusCache)return _statusCache[ds];
  const d=(now-new Date(ds).getTime())/60000;
  const st=d<0?'upcoming':d<120?'live':'finished';
  _statusCache[ds]=st;
  return st;
}
function getResult(m){
  const s1=m.score1,s2=m.score2;
  if(s1===null||s1===undefined||s2===null||s2===undefined)return null;
  const a=Number(s1)+(m.handicap1||0),b=Number(s2)+(m.handicap2||0);
  return a>b?'win':a===b?'draw':'loss';
}
// Trả về { poisonerId, entry } nếu uid là nạn nhân của Táo Độc trên trận mid (chỉ người ĐẦU TIÊN tìm thấy — giữ tương thích cũ)
function getPoisoner(targetUid, mid){
  const list=getPoisoners(targetUid,mid);
  return list.length?list[0]:null;
}
// Trả về TẤT CẢ {poisonerId, entry} nếu uid là nạn nhân của nhiều người Táo Độc trên trận mid
function getPoisoners(targetUid, mid){
  if(!S.kbmt) return[];
  const out=[];
  for(const [poisonerId,pData] of Object.entries(S.kbmt)){
    if(poisonerId===targetUid) continue;
    const entry=pData[mid];
    if(entry&&entry.result==='quaTaoDuc'&&entry.poisonTarget===targetUid) out.push({poisonerId,entry});
  }
  return out;
}
// Trả về TẤT CẢ {giverId, entry} nếu uid là mục tiêu bị (có thể nhiều) người khác chọn
// "trừng phạt" bằng Táo Nhãn Lồng (lựa chọn 'target') trên trận mid
function getTaoNhanLongVictims(targetUid, mid){
  if(!S.kbmt) return[];
  const out=[];
  for(const [giverId,gData] of Object.entries(S.kbmt)){
    if(giverId===targetUid) continue;
    const entry=gData[mid];
    if(entry&&entry.result==='taoNhanLong'&&entry.taoNhanLongChoice==='target'&&entry.taoNhanLongVictimId===targetUid) out.push({giverId,entry});
  }
  return out;
}

function calcPts(uid){
  let t=0;
  const pr=S.predictions[uid]||{};
  const starUsed=S.starUsed[uid]||{};
  const shUsed=(S.shieldUsed&&S.shieldUsed[uid])||{};
  // Sort matches by date to compute streak correctly
  const sorted=getSortedMatches();
  let streak=0; // current correct streak at time of each match
  const shieldCosts=S.shieldCosts&&S.shieldCosts[uid]||{};
  sorted.forEach(m=>{
    const rnd=m.round||'g';
    const pen=PEN[rnd]||PEN.g;      // e.g. -10
    const absPen=Math.abs(pen);       // e.g. 10
    const hasStar=!!starUsed[m.id];
    const hasShield=!!shUsed[m.id];
    const starCost=Math.ceil(absPen*0.75);

    // ── Item purchase costs ──
    if(hasShield) t-=(shieldCosts[m.id]||shieldPrice(streak));
    if(hasStar){
      // Tài Trợ Ngôi Sao: refund the star cost
      const kbmtD2=(getKbmtData(uid))[m.id];
      const isStarSponsored=kbmtD2&&kbmtD2.starSponsor;
      if(!isStarSponsored) t-=starCost;
      // if sponsored → no cost (refund = never charge)
    }

    // ── KBMT immediate penalty (Đồng Nát Sắt Vụn: 20% absPen up-front) ──
    const kbmtD=(getKbmtData(uid))[m.id];
    if(kbmtD&&kbmtD.immediatePenalty) t-=kbmtD.immediatePenalty;

    const res=getResult(m);
    if(!res)return; // match not played yet

    const p=pr[m.id];
    if(!p){ // no prediction = treat as wrong answer
      streak=0;
      if(!hasShield) t+=pen; // deduct penalty; shield doesn't save "no pick"
      return;
    }

    const correct=p.choice===res;

    // ── KBMT result modifier ──
    // Reads the gacha result stored for this match and uid
    const kbmtR=kbmtD?kbmtD.result:null;
    // noPenalty: skip the normal wrong-answer deduction
    // extraPts: bonus/malus applied on top after normal logic
    let kbmtNoPenalty=false, kbmtExtraPts=0;
    if(kbmtR==='hoangThan'){
      if(correct) kbmtExtraPts=Math.round(absPen*0.5);  // +50% of absPen
      else        kbmtNoPenalty=true;                    // no deduction at all
    } else if(kbmtR==='haoQuang'){
      kbmtNoPenalty=true; // immune regardless
    } else if(kbmtR==='cuLua'){
      if(!correct) kbmtExtraPts=-Math.round(absPen*0.5); // extra -50%
    } else if(kbmtR==='quaBongCuoi'){
      if(correct) kbmtExtraPts=Math.round(absPen*0.1);   // +10% nếu đúng
    } else if(kbmtR==='quaTaoDuc'){
      // Nếu target đoán ĐÚNG → người quay bị phạt thêm -20%
      const poisonTgt=kbmtD.poisonTarget;
      if(poisonTgt){
        const tgtPred=(S.predictions[poisonTgt]||{})[m.id];
        const tgtRes=getResult(m);
        const tgtCorrect=!!(tgtPred&&tgtRes&&tgtPred.choice===tgtRes);
        if(tgtCorrect) kbmtExtraPts=-Math.round(absPen*0.2);
      }
    } else if(kbmtR==='taoNhanLong'){
      // Đoán ĐÚNG → chờ user chọn thưởng: (self) +5% hoặc (target) trừng phạt người khác −15% (không tự cộng cho mình)
      // Đoán SAI → tự động trừ thêm 10% điểm phạt, không cần lựa chọn
      if(correct){
        if(kbmtD.taoNhanLongChoice==='self') kbmtExtraPts=Math.round(absPen*0.05);
        // choice==='target' hoặc chưa chọn: không có hiệu ứng trực tiếp lên chính người quay
      } else {
        kbmtExtraPts=-Math.round(absPen*0.1);
      }
    }
    // taiTro + kimBaiDorm have no match-result modifier (handled above)

    // ── Kiểm tra uid có phải nạn nhân của (có thể nhiều) Táo Độc không ──
    const poisonInfoList=getPoisoners(uid,m.id);
    if(poisonInfoList.length&&!correct){
      // Nạn nhân đoán SAI → bị trừ thêm 10% MỖI quả táo nhận được
      kbmtExtraPts-=Math.round(absPen*0.1)*poisonInfoList.length;
    }
    // (Nếu nạn nhân đoán ĐÚNG → từng người quay tương ứng bị phạt riêng, nạn nhân không bị gì thêm)

    // ── Kiểm tra uid có bị (có thể nhiều) Táo Nhãn Lồng chọn làm mục tiêu trừng phạt không ──
    const tnlVictimList=getTaoNhanLongVictims(uid,m.id);
    if(tnlVictimList.length){
      // Người bị chọn đã được đảm bảo đoán SAI tại thời điểm chọn → luôn bị trừ thêm 15% MỖI lần bị nhắm
      kbmtExtraPts-=Math.round(absPen*0.15)*tnlVictimList.length;
    }

    // ── Normal scoring + KBMT overlay ──
    if(hasStar&&hasShield){
      if(correct){ t+=Math.round(absPen*1.5); streak++; }
      else{
        if(!kbmtNoPenalty) t+=pen;
        t+=kbmtExtraPts;
        /* streak KHÔNG MẤT nhờ khiên */
      }
    } else if(hasStar){
      if(correct){ t+=Math.round(absPen*1.5); t+=kbmtExtraPts; streak++; }
      else{
        if(!kbmtNoPenalty) t+=pen;
        t+=kbmtExtraPts;
        streak=0;
      }
    } else if(hasShield){
      if(correct){ t+=kbmtExtraPts; streak++; }
      else{
        if(!kbmtNoPenalty) t+=pen;
        t+=kbmtExtraPts;
        // sai: chuỗi giữ nguyên nhờ khiên
      }
    } else {
      // ── Pre-compute blessing state for this match (no state mutation here) ──
      const lossStrBefore=calcLossStreakBefore(uid,m.id,sorted);
      // Blessing áp dụng khi: đang active VÀ chuỗi thua trước trận này >= threshold
      // VÀ chuỗi thua trước trận này >= activatedAtStreak (blessing đã được nhận tại mốc đó)
      const bl_=S.blessings&&S.blessings[uid];
      // Blessing chỉ áp dụng đúng 1 trận = targetMatchId được lưu khi nhận
      // Bất kể thắng hay thua, deactivate được xử lý bởi resolveBlessingDeactivations()
      const blessingApplies=bl_&&(isBlessingActive(uid)||(bl_.deactivatedAfterMatchId&&m.id===bl_.deactivatedAfterMatchId))&&bl_.targetMatchId===m.id;
      if(correct){
        t+=kbmtExtraPts;
        // Đúng có blessing: không trừ tribute nữa — đơn giản hóa thành 1 trận
        streak++;
      } else {
        if(blessingApplies){
          // Giảm 30% điểm phạt cho đúng 1 trận này
          if(!kbmtNoPenalty) t+=Math.round(pen*(1-BLESSING_PENALTY_REDUCTION));
        } else {
          if(!kbmtNoPenalty) t+=pen;
        }
        t+=kbmtExtraPts;
        streak=0;
      }
    }
    // ── Đối đầu 1vs1 (cộng/trừ thêm, độc lập với các luật khác) ──
    const duel=getAcceptedDuelForUserMatch(uid,m.id);
    if(duel){
      const amt=duelStakeAmounts(absPen,duel.stake);
      const outcome=resolveDuelOutcome(duel);
      if(outcome){
        if(outcome.winnerId===uid) t+=amt.win;
        else if(outcome.loserId===uid) t-=amt.loss;
      } else {
        // Cả 2 đoán sai (hòa kèo) → mỗi người bị trừ thêm push% giá trị đối kháng
        t-=amt.push;
      }
    }
    // Streak bonus milestones
    if(STREAK_BONUS[streak]) t+=STREAK_BONUS[streak];
  });
  return t;
}
// Tính streak hiện tại của user (chuỗi đúng chưa bị phá)
function calcStreak(uid){
  const pr=S.predictions[uid]||{};
  const shUsed=(S.shieldUsed&&S.shieldUsed[uid])||{};
  const starUsed=S.starUsed[uid]||{};
  const sorted=getSortedMatches();
  let streak=0;
  for(const m of sorted){
    const res=getResult(m);
    if(!res) continue;
    const p=pr[m.id];
    if(!p){ streak=0; continue; } // no prediction = wrong, streak reset
    const correct=p.choice===res;
    const hasShield=shUsed[m.id];
    const hasStar=starUsed[m.id];
    // Khiên bảo vệ chuỗi VÔ ĐIỀU KIỆN khi đoán sai — bất kể có dùng kèm Ngôi Sao hay không.
    // Phải kiểm tra hasShield TRƯỚC hasStar (khớp đúng với calcPts: nhánh hasStar&&hasShield
    // vẫn giữ chuỗi khi sai). Sao chỉ ảnh hưởng điểm số (thưởng cao hơn khi đúng), không
    // quyết định việc chuỗi có được giữ hay không.
    if(hasShield){
      // đúng: chuỗi tăng; sai: chuỗi giữ nguyên (không mất) — dù có Sao hay không
      if(correct) streak++;
    } else if(hasStar){
      if(correct) streak++;
      else streak=0;
    } else {
      if(correct) streak++;
      else streak=0;
    }
  }
  return streak;
}
function updatePts(){S.users.forEach(u=>{if(!u.isAdmin)u.points=calcPts(u.id);});}

// Sau khi tính điểm xong, xác định ai cần deactivate blessing
// (tách ra khỏi calcPts để tránh side effect trong hàm tính điểm)
function resolveBlessingDeactivations(){
  if(!S.blessings) return;
  let changed=false;
  S.users.forEach(u=>{
    if(u.isAdmin) return;
    if(!isBlessingActive(u.id)) return;
    const bl=S.blessings[u.id];
    if(!bl||!bl.targetMatchId) return;
    const sorted=getSortedMatches();
    // Deactivate khi trận targetMatchId đã có kết quả (bất kể thắng hay thua)
    const target=sorted.find(m=>m.id===bl.targetMatchId);
    if(target&&getResult(target)){
      bl.active=false;
      bl.deactivatedAfterMatchId=target.id;
      // Reset để chuỗi thua mới (sau trận này) được tính lại từ 0
      bl.dismissedAtStreak=null;
      bl.dismissedStreakStart=null;
      changed=true;
    }
  });
  return changed;
}

// kbmt[uid][mid] = { used: bool, result: 'hoangThan'|'haoQuang'|'cuLua'|'taiTro'|'kimBaiDorm', timestamp }
// kbmt[uid].banUntil = matchIndex (banned from KBMT for next 5 matches if user flees)
// kbmt[uid].fleeCount = number of times fled

const KBMT_RESULTS=[
  {id:'hoangThan',    pct:10, emoji:'👑', name:'Hoàng Thân Quốc Thích',      color:'gold'},
  {id:'haoQuang',     pct:0,  emoji:'🎆', name:'Hào Quang Nhân Vật Chính',   color:'green'},
  {id:'cuLua',        pct:15, emoji:'💀', name:'Vé Hợp Đồng Kỳ Nghỉ',        color:'red'},
  {id:'taiTro',       pct:10, emoji:'⭐', name:'Tài Trợ Ngôi Sao',            color:'gold'},
  {id:'quaBongCuoi',  pct:15, emoji:'🎈', name:'Quả Bóng Cười',               color:'cyan'},
  {id:'quaTaoDuc',    pct:0,  emoji:'🍏', name:'Quả Táo Độc',                 color:'poison'},
  {id:'taoNhanLong',  pct:20, emoji:'🍎', name:'Táo Nhãn Lồng',              color:'violet'},
  {id:'kimBaiDorm',   pct:30, emoji:'🔩', name:'Đồng Nát Sắt Vụn',           color:'dark'},
];

function kbmtRoll(){
  const r=Math.random()*100;
  let cum=0;
  for(const res of KBMT_RESULTS){
    cum+=res.pct;
    if(r<cum) return res;
  }
  return KBMT_RESULTS[KBMT_RESULTS.length-1];
}

function getKbmtData(uid){
  if(!S.kbmt) S.kbmt={};
  if(!S.kbmt[uid]) S.kbmt[uid]={};
  return S.kbmt[uid];
}

function isKbmtBanned(uid){
  const d=getKbmtData(uid);
  if(!d.banUntilMatch) return false;
  // Count how many upcoming/finished matches have passed since ban
  const sorted=getSortedMatches();
  const banMatch=sorted.find(m=>m.id===d.banUntilMatchId);
  if(!banMatch) return false;
  // Count matches from the ban point
  const banIdx=sorted.indexOf(banMatch);
  const curIdx=sorted.findIndex(m=>getStatus(m.date)==='upcoming');
  const passed=curIdx-banIdx;
  return passed<5;
}

function kbmtBanRemaining(uid){
  const d=getKbmtData(uid);
  if(!d.banUntilMatchId) return 0;
  const sorted=getSortedMatches();
  const banIdx=sorted.findIndex(m=>m.id===d.banUntilMatchId);
  const curIdx=sorted.findIndex(m=>getStatus(m.date)==='upcoming');
  if(banIdx<0||curIdx<0) return 0;
  return Math.max(0,5-(curIdx-banIdx));
}

function canUseKbmt(uid, mid){
  // Must have a prediction on that match already
  const pred=(S.predictions[uid]||{})[mid];
  if(!pred) return false;
  // Match must be upcoming
  const m=S.matches.find(x=>x.id===mid);
  if(!m||getStatus(m.date)!=='upcoming') return false;
  // Not already used
  const d=getKbmtData(uid);
  if(d[mid]) return false;
  // Not banned
  if(isKbmtBanned(uid)) return false;
  return true;
}

let _kbmtGachaInProgress=false;
function executeKbmtGacha(mid){
  if(_kbmtGachaInProgress) return; // chặn double-click / double-tap
  // ── Kiểm tra kết nối TRƯỚC khi quay ──
  // Nếu quay khi mất kết nối, kết quả chỉ tồn tại cục bộ trên thiết bị và
  // không được ghi nhận ngay lên Firebase. Người chơi có thể tưởng lượt quay
  // "chưa xảy ra" (vì các thiết bị/tab khác chưa thấy) và quay lại lần nữa khi
  // có mạng trở lại — dẫn tới đổi kết quả Kim Bài đã quay. Vì vậy phải chặn
  // hẳn việc quay ngay từ đầu nếu chưa chắc chắn có kết nối tới Firebase.
  if(!isFbConnected()){
    toast('📡 Mất kết nối mạng! Kim Bài CHƯA được quay — vui lòng kiểm tra kết nối rồi thử lại.','error');
    return; // Không đóng popup, không roll, không đổi state — an toàn để thử lại
  }

  _kbmtGachaInProgress=true;
  closeKbmtPopup();
  showKbmtConnecting();

  const result=kbmtRoll();
  const uid=S.session;
  const d=getKbmtData(uid);
  const prevEntry=d[mid]; // backup để hoàn tác nếu ghi thất bại giữa chừng

  d[mid]={used:true, result:result.id, ts:Date.now()};

  saveAndSyncKbmtConfirmed(uid).then(ok=>{
    hideKbmtConnecting();
    _kbmtGachaInProgress=false;
    if(!ok){
      // Mất kết nối giữa chừng (sau khi qua bước kiểm tra ban đầu) → hoàn tác,
      // KHÔNG tính lượt quay này để tránh mất Kim Bài oan mà không có kết quả.
      if(prevEntry===undefined) delete d[mid]; else d[mid]=prevEntry;
      saveLocal();
      toast('⚠️ Mất kết nối giữa chừng, kết quả CHƯA được ghi nhận. Kim Bài chưa bị tính — hãy thử lại khi mạng ổn định!','error');
      render();
      return;
    }
    showKbmtResult(mid, result);
  });
}

  document.body.appendChild(overlay);

function applyKbmtImmediate(resultId, mid){
  const uid=S.session;
  const m=S.matches.find(x=>x.id===mid);
  const rnd=m?m.round||'g':'g';
  const absPen=Math.abs(PEN[rnd]||PEN.g);
  const d=getKbmtData(uid);
  if(resultId==='kimBaiDorm'){
    const immPen=Math.round(absPen*0.2);
    // Store the penalty value so calcPts can read it — do NOT manually adjust u.points
    if(d[mid]) d[mid].immediatePenalty=immPen;
    saveAndSyncKbmt(uid); // updatePts() inside saveAndSyncKbmt will recompute correctly
    toast(`🔩 Đồng Nát Sắt Vụn! Bị trừ ${immPen}đ ngay!`,'error');
  } else if(resultId==='taiTro'){
    if(d[mid]) d[mid].starSponsor=true;
    saveAndSyncKbmt(uid);
    toast('⭐ Tài Trợ Ngôi Sao! Mua Ngôi Sao trận này sẽ được miễn phí!','success');
  } else if(resultId==='quaBongCuoi'){
    saveAndSyncKbmt(uid);
    toast('🎈 Quả Bóng Cười! Đoán đúng trận này sẽ nhận thêm điểm bonus!','success');
  } else if(resultId==='quaTaoDuc'){
    saveAndSyncKbmt(uid);
    // Mở popup chọn nạn nhân sau 1 nhịp nhỏ
    setTimeout(()=>openPoisonTargetPicker(mid),350);
  } else if(resultId==='taoNhanLong'){
    saveAndSyncKbmt(uid);
    toast('🍎 Táo Nhãn Lồng! Đoán đúng trận này sẽ được chọn phần thưởng, đoán sai sẽ bị phạt thêm.','info');
  } else {
    saveAndSyncKbmt(uid);
  }
}

/* ── TÁO NHÃN LỒNG: chọn thưởng sau khi trận kết thúc (đoán đúng) ── */
// entry.taoNhanLongChoice: undefined (chờ chọn) | 'self' (+5% cho mình) | 'target' (trừng phạt 1 người đoán sai -15%)
// entry.taoNhanLongVictimId: uid nạn nhân nếu choice==='target'
let tnlPopupDismissed={};
function getPendingTaoNhanLongMatch(uid){
  const d=getKbmtData(uid);
  for(const mid in d){
    const e=d[mid];
    if(!e||e.result!=='taoNhanLong'||e.taoNhanLongChoice) continue;
    if(tnlPopupDismissed[mid]) continue;
    const m=S.matches.find(x=>String(x.id)===String(mid));
    if(!m) continue;
    const res=getResult(m);
    if(!res) continue; // trận chưa có kết quả
    const pred=(S.predictions[uid]||{})[mid];
    if(pred&&pred.choice===res) return m; // đoán đúng, đang chờ chọn thưởng
  }
  return null;
}
function shouldShowTaoNhanLongPopup(uid){
  return !!getPendingTaoNhanLongMatch(uid);
}
function showTaoNhanLongPopup(mid){
  if(document.getElementById('tnl-overlay')) return;
  const m=S.matches.find(x=>x.id===mid);
  if(!m) return;
  const absPen=Math.abs(PEN[m.round||'g']||PEN.g);
  const overlay=document.createElement('div');
  overlay.className='kbmt-overlay';
  overlay.id='tnl-overlay';
  overlay.innerHTML=`<div class="kbmt-box">
    <div class="kbmt-crown">🍎</div>
    <div class="kbmt-title">TÁO NHÃN LỒNG</div>
    <div class="kbmt-subtitle">✦ ${m.team1} vs ${m.team2} — bạn đã đoán đúng! ✦</div>
    <div class="kbmt-royal-divider"></div>
    <div class="kbmt-lead">Trái táo đã nảy mầm — chọn phần thưởng của bạn:</div>
    <div class="kbmt-btns">
      <button class="kbmt-btn-accept" onclick="resolveTaoNhanLong(${mid},'self')">🍎 Nhận ngay +${Math.round(absPen*0.05)}đ cho mình</button>
      <button class="kbmt-btn-accept" style="background:linear-gradient(135deg,#7C3AED,#A855F7,#7C3AED)" onclick="resolveTaoNhanLong(${mid},'target')">☠️ Trừng phạt 1 người đoán sai −${Math.round(absPen*0.15)}đ</button>
      <button class="kbmt-btn-flee" onclick="dismissTaoNhanLongPopup(${mid})">⏭️ Để sau — quyết định trong trang Lịch đấu</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}
function dismissTaoNhanLongPopup(mid){
  tnlPopupDismissed[mid]=true;
  const el=document.getElementById('tnl-overlay');
  if(el) el.remove();
}
function resolveTaoNhanLong(mid, choice){
  const uid=S.session;
  const d=getKbmtData(uid);
  const entry=d[mid];
  if(!entry||entry.result!=='taoNhanLong'||entry.taoNhanLongChoice) { const el=document.getElementById('tnl-overlay'); if(el) el.remove(); return; }
  const m=S.matches.find(x=>x.id===mid);
  const res=m?getResult(m):null;
  if(!res) return;
  if(choice==='target'){
    // Tìm những người khác đã đoán SAI trận này
    const candidates=S.users.filter(x=>!x.isAdmin&&x.id!==uid).filter(x=>{
      const p=(S.predictions[x.id]||{})[mid];
      return p&&p.choice&&p.choice!==res;
    });
    if(candidates.length){
      const victim=candidates[Math.floor(Math.random()*candidates.length)];
      entry.taoNhanLongChoice='target';
      entry.taoNhanLongVictimId=victim.id;
      toast(`🍎 Táo Nhãn Lồng đã trừng phạt ${victim.displayName||victim.name} — trừ thêm điểm phạt trận!`,'success');
    } else {
      // Không có ai đoán sai để trừng phạt → tự động chuyển thành nhận thưởng cho mình
      entry.taoNhanLongChoice='self';
      toast('🍎 Không có ai đoán sai trận này — Táo Nhãn Lồng tự động đổi thành phần thưởng cho bạn!','info');
    }
  } else {
    entry.taoNhanLongChoice='self';
    toast('🍎 Táo Nhãn Lồng! Bạn nhận thêm điểm thưởng trận này!','success');
  }
  const el=document.getElementById('tnl-overlay');
  if(el) el.remove();
  saveAndSyncKbmt(uid);
  render();
}

function closeKbmtResult(){
  const el=document.getElementById('kbmt-gacha-overlay');
  if(el) el.remove();
  render();
}

function closePoisonTargetPicker(){
  const el=document.getElementById('poison-picker-overlay');
  if(el) el.remove();
}

function openPoisonTargetPicker(mid, overrideUid){
  if(document.getElementById('poison-picker-overlay')) return;
  const uid=overrideUid||S.session;
  const m=S.matches.find(x=>x.id===mid);
  if(!m) return;
  // Chỉ cho phép chọn/đổi khi trận chưa diễn ra
  if(getStatus(m.date)!=='upcoming'){
    toast('⏳ Trận đã bắt đầu, không thể thay đổi nạn nhân!','error');
    return;
  }
  // Danh sách người chơi khác (không phải admin, không phải mình)
  const others=S.users.filter(u=>!u.isAdmin&&u.id!==uid);
  if(!others.length){
    toast('🍏 Không có đối thủ để đầu độc — Vua tạm thu lại táo!','info');
    return;
  }
  const AV_COLORS=['#F97316','#1E56E0','#22C55E','#8B5CF6','#EC4899','#F59E0B','#06B6D4','#EF4444'];
  // Kiểm tra xem đã chọn nạn nhân trước đó chưa
  const kd=getKbmtData(uid);
  const existingTarget=kd[mid]?kd[mid].poisonTarget:null;
  const isRePick=!!existingTarget;
  const existingUser=existingTarget?S.users.find(u=>u.id===existingTarget):null;
  const existingName=existingUser?(existingUser.displayName||existingUser.name):'';
  const rowsHtml=others.map(u=>{
    const dn=u.displayName||u.name;
    const avC=AV_COLORS[u.id.charCodeAt(u.id.length-1)%AV_COLORS.length];
    const isCurrent=u.id===existingTarget;
    // Lấy dự đoán của user này cho trận mid
    const uPred=(S.predictions[u.id]||{})[mid];
    let predBadge='';
    if(uPred&&uPred.choice){
      const choiceLabel=uPred.choice==='win'?m.team1:uPred.choice==='draw'?'🤝 Hòa':m.team2;
      const col=uPred.choice==='win'?'#93C5FD':uPred.choice==='draw'?'#FCD34D':'#FCA5A5';
      const bg=uPred.choice==='win'?'rgba(59,130,246,.15)':uPred.choice==='draw'?'rgba(245,158,11,.15)':'rgba(239,68,68,.15)';
      const border=uPred.choice==='win'?'rgba(59,130,246,.4)':uPred.choice==='draw'?'rgba(245,158,11,.4)':'rgba(239,68,68,.4)';
      predBadge=`<span style="font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;background:${bg};border:1px solid ${border};color:${col};white-space:nowrap;flex-shrink:0">${choiceLabel}</span>`;
    } else {
      predBadge=`<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;background:rgba(100,100,100,.1);border:1px solid rgba(100,100,100,.25);color:var(--text4);white-space:nowrap;flex-shrink:0">Chưa chọn</span>`;
    }
    return`<button class="poison-target-row" style="${isCurrent?'border-color:rgba(34,197,94,.7);background:rgba(34,197,94,.15);box-shadow:0 0 10px rgba(34,197,94,.2)':''}" onclick="confirmPoisonTarget('${uid}',${mid},'${u.id}')">
      <div class="poison-target-av" style="background:${avC}">${dn[0].toUpperCase()}</div>
      <span style="flex:1;text-align:left">${dn}${isCurrent?' <span style="font-size:9px;font-weight:800;color:#86EFAC;background:rgba(34,197,94,.15);padding:1px 5px;border-radius:4px">Hiện tại</span>':''}</span>
      ${predBadge}
      <span class="poison-target-pts">${u.points}đ</span>
    </button>`;
  }).join('');
  const absPen=Math.abs(PEN[m.round||'g']||PEN.g);
  const overlay=document.createElement('div');
  overlay.className='poison-picker-overlay';
  overlay.id='poison-picker-overlay';
  overlay.innerHTML=`<div class="poison-picker-box">
    <div style="text-align:center;font-size:52px;filter:drop-shadow(0 0 18px rgba(34,197,94,.8));margin-bottom:6px">🍏</div>
    <div class="poison-picker-title">${isRePick?'ĐỔI NẠN NHÂN':'CHỌN NẠN NHÂN'}</div>
    <div class="poison-picker-sub">${isRePick?`Đang trao cho: ${existingName} — Chọn người khác?`:'Trao Táo Độc Cho Ai?'}</div>
    ${isRePick?`<div style="background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:7px 10px;font-size:11px;color:rgba(134,239,172,.8);text-align:center;margin-bottom:10px">⚠️ Thay đổi có hiệu lực đến trước khi trận <strong>${m.team1} vs ${m.team2}</strong> bắt đầu</div>`:''}
    <div class="poison-picker-lead">
      Nếu họ đoán <strong style="color:#FCA5A5">sai</strong> → họ bị trừ thêm <strong style="color:#FCA5A5">${Math.round(absPen*0.1)}đ</strong><br>
      Nếu họ đoán <strong style="color:#86EFAC">đúng</strong> → bạn bị bắt vì tội đầu độc, mất thêm <strong style="color:#FCA5A5">${Math.round(absPen*0.2)}đ</strong>
    </div>
    <div class="poison-target-list">${rowsHtml}</div>
    <button class="poison-picker-cancel" onclick="${isRePick?`closePoisonTargetPicker()`:`skipPoisonTarget('${uid}',${mid})`}">${isRePick?'✕ Giữ nguyên lựa chọn hiện tại':'🏃 Bỏ qua — không đầu độc ai'}</button>
  </div>`;
  document.body.appendChild(overlay);
}

// Admin gọi picker thay cho user (hoặc user tự đổi nạn nhân từ match card)
function adminRedirectPoisonPick(uid, mid){
  // Mở picker với uid của user được chọn
  openPoisonTargetPicker(mid, uid);
}

// User tự đổi nạn nhân táo độc từ match card (chỉ khi trận chưa bắt đầu)
function reopenPoisonTargetPicker(mid){
  openPoisonTargetPicker(mid);
}

function confirmPoisonTarget(poisonerId, mid, targetId){
  closePoisonTargetPicker();
  const d=getKbmtData(poisonerId);
  if(d[mid]) d[mid].poisonTarget=targetId;
  saveAndSyncKbmt(poisonerId);
  const targetUser=S.users.find(u=>u.id===targetId);
  const targetName=targetUser?(targetUser.displayName||targetUser.name):'đối thủ';
  toast(`🍏 Đã trao Táo Độc cho ${targetName} — chờ xem số phận xoay vần!`,'info');
  render();
}

function skipPoisonTarget(poisonerId, mid){

// Full save (local + Firebase) - called after user actions
function saveAndSync(){
  updatePts();
  resolveBlessingDeactivations(); // ✅ Deactivate blessing sau khi tính điểm, trước khi lưu
  save();
}
// Scoped save for KBMT actions: only pushes the CURRENT user's own kbmt branch
// to Firebase (kbmt/{uid}) instead of overwriting the whole shared /kbmt node
// with this client's (possibly stale) local copy of every user's data.
// This mirrors the safe pattern already used for predictions/starUsed/shieldUsed
// (see pred(), confirmBuyStar(), confirmBuyShield()) and prevents a race where
// another user's save (or this user's own slow/failed write) wipes out a
// just-recorded KBMT result, which is what made spins appear to "disappear".
function saveAndSyncKbmt(uid){
  updatePts();
  resolveBlessingDeactivations();
  saveLocal();
  fbSave('kbmt/'+uid, S.kbmt[uid]||{});
}
// Biến thể CÓ CHỜ XÁC NHẬN của saveAndSyncKbmt — dùng riêng cho việc quay Kim
// Bài Miễn Tử, nơi bắt buộc phải biết chắc kết quả đã lên Firebase thành công
// trước khi coi lượt quay là hợp lệ. Trả về true nếu ghi thành công, false nếu
// không (mất kết nối giữa chừng, lỗi mạng...).
async function saveAndSyncKbmtConfirmed(uid){
  updatePts();
  resolveBlessingDeactivations();
  saveLocal();
  return await fbSaveConfirmed('kbmt/'+uid, S.kbmt[uid]||{});
}

// Returns last N results for a team as array of 'W','D','L'
function getTeamForm(teamName, beforeMatchId, n=3){
  const finished=S.matches.filter(m=>
    m.id!==beforeMatchId &&
    (m.team1===teamName||m.team2===teamName) &&
    m.score1!=null && m.score2!=null
  ).sort((a,b)=>new Date(b.date)-new Date(a.date));
  return finished.slice(0,n).reverse().map(m=>{
    const isHome=m.team1===teamName;
    const s1=m.score1,s2=m.score2;
    if(s1===s2) return'D';
    const won=isHome?s1>s2:s2>s1;
    return won?'W':'L';
  });
}

    return`<span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;background:${bg};border:1px solid ${border};color:${col};font-size:8.5px;font-weight:900;letter-spacing:0;line-height:1;flex-shrink:0">${r}</span>`;
  });
  const gap='display:flex;align-items:center;gap:2px;flex-shrink:0';
  return`<div style="${gap}">${badges.join('')}</div>`;
}
function renderMatches(u){

  // Count for badge hints
  const counts={};

      if(preds[m.id])counts.predicted=(counts.predicted||0)+1;

  // Blessing status banner (non-admin only)

        <div style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px">
          <span style="font-size:18px;filter:drop-shadow(0 0 8px rgba(180,80,255,.8))">🌙</span>
          <span>Phước Lành đang hiệu lực</span>
          <span class="blessing-active-badge" style="font-size:10px;padding:2px 8px">✨ Active</span>
        </div>
        <div style="font-size:11px;color:rgba(180,130,255,.7)">Đang trong chuỗi thua ${lossStrk} trận · Hiệu lực 1 trận tiếp theo · Giảm 30% điểm phạt · Tự hóa giải sau trận đó</div>
      </div>`;
    } else if(lossStrk>=BLESSING_LOSS_STREAK_THRESHOLD){
      blessingBanner=`<div class="info-box" style="border-color:rgba(160,60,60,.35);background:rgba(120,20,20,.06);color:#FCA5A5;flex-direction:column;gap:3px;margin-bottom:10px;cursor:pointer" onclick="showBlessingPopup('${u.id}')">
        <div style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px">
          <span style="font-size:18px">🌙</span>
          <span>Vận đen đang bao trùm — Chuỗi thua ${lossStrk} trận</span>
        </div>
        <div style="font-size:11px;color:rgba(255,160,160,.7)">Thần linh đang chờ — nhấn vào đây trước khi cánh cửa phước lành khép lại!</div>
      </div>`;
    }
  }

  let filtered=S.matches.filter(m=>{
    if(filt!=='all'&&m.round!==filt)return false;
    if(grp!=='all'&&m.group!==grp)return false;
    // Status/prediction filter
    if(sfilt!=='all'){
      const st=getStatus(m.date);
      if(sfilt==='upcoming'&&st!=='upcoming')return false;
      if(sfilt==='live'&&st!=='live')return false;
      if(sfilt==='finished'&&st!=='finished')return false;
      if(sfilt==='predicted'&&!preds[m.id])return false;
      if(sfilt==='unpredicted'&&(preds[m.id]||st!=='upcoming'))return false;
    }
    return true;
  });
  const byRnd={};
  filtered.forEach(m=>{if(!byRnd[m.round])byRnd[m.round]=[];byRnd[m.round].push(m);});
  // Khi lọc "Đã diễn ra": sắp xếp mới nhất trước trong mỗi vòng
  const isFinishedView=sfilt==='finished';
  if(isFinishedView){
    Object.keys(byRnd).forEach(rnd=>{
      byRnd[rnd].sort((a,b)=>new Date(b.date)-new Date(a.date));
    });
  }
  let html='';
  RORD.forEach(rnd=>{
    const list=byRnd[rnd];if(!list||!list.length)return;
    if(filt==='all'&&grp==='all'&&sfilt==='all')html+=`<div class="rnd-hdr">${RICO[rnd]} ${RND[rnd]}</div>`;
    list.forEach(m=>{
      const st=getStatus(m.date);
      const res=getResult(m);
      const pred=preds[m.id];
      const hasStar=(S.starUsed[u.id]||{})[m.id];
      const myDuelLockRaw=!u.isAdmin?getUserDuel(u.id,m.id):null;
      const myDuelLock=myDuelLockRaw&&myDuelLockRaw.status==='accepted'?myDuelLockRaw:null;
      const canPred=st==='upcoming'&&!u.isAdmin&&m.hcSaved===true&&!myDuelLock;
      const d=new Date(m.date);
      const dStr=d.toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit'})+' · '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
      const stTxt={upcoming:'Sắp diễn ra',live:'🔴 Đang diễn ra',finished:'Đã kết thúc'}[st];
      const bCls=type=>{
        let c=`pb ${type}-b`;
        if(pred&&pred.choice===type){if(res)c+=pred.choice===res?' correct':' wrong';else c+=' sel';}

      };
      // Handicap: compute badge for the receiving (positive) side, shown next to that team's name
      const hasHC=m.handicap1!==0||m.handicap2!==0;
      const fmtHC=v=>{

        const abs=Math.abs(v);
        const frac={0.25:'¼',0.5:'½',0.75:'¾',1.25:'1¼',1.5:'1½',1.75:'1¾',2.5:'2½'};
        const base=frac[Math.round(abs*100)/100]||String(abs);
        return(v>0?'+':'')+base;
      };
      let hcBadge1='', hcBadge2='', hcAdj='';
      if(hasHC){

      }
      const _s1=m.score1,_s2=m.score2;

      const drawn90Disp=_s1!==null&&_s2!==null&&Number(_s1)===Number(_s2);
      const hasETDisp=isKODisp&&drawn90Disp&&m.scoreET1!==null&&m.scoreET1!==undefined&&m.scoreET2!==null&&m.scoreET2!==undefined;
      // Tỷ số hiển thị ở ô chính: nếu có hiệp phụ → tổng 90'+120'; ngược lại → tỷ số 90'
      const dispS1=hasETDisp?Number(_s1)+Number(m.scoreET1):_s1;
      const dispS2=hasETDisp?Number(_s2)+Number(m.scoreET2):_s2;
      const aggDrawn=hasETDisp&&dispS1===dispS2;
      let etLine='';

        ?`<div class="score-box">${dispS1} – ${dispS2}</div><div class="score-lbl">${hasETDisp?'Tỷ số chung cuộc':'Tỷ số chính thức (90\')'}</div>${etLine}`
        :`<div class="vs">VS</div>`;
      // ── Đội đi tiếp (chỉ áp dụng vòng knockout có kết quả rõ ràng) ──

      if(isKODisp&&res){
        if(!drawn90Disp) advancedTeam=Number(_s1)>Number(_s2)?m.team1:m.team2;

        else if(m.penWinner) advancedTeam=m.penWinner;
      }
      const rnd=m.round||'g';
      const base=PEN[rnd]||PEN.g;
      const okPts=PTS_OK[rnd]||PTS_OK.g;
      const grpTag=m.group&&!['R32','R16','QF','SF','TP','F'].includes(m.group)?`Bảng ${m.group} · `:'';
      const usedOnThis=(S.starUsed[u.id]||{})[m.id];
      const usedShieldOnThis=(S.shieldUsed&&S.shieldUsed[u.id]&&S.shieldUsed[u.id][m.id]);
      const absPenForPoison=Math.abs(base);
      // ── Táo Độc overlay: 2 chiều độc lập (có thể xảy ra đồng thời trong 1 trận) ──

      const poisonersOfThis=res?getPoisoners(u.id,m.id):[];
      let poisonGaveLine=null, poisonReceivedLine=null;
      if(res&&isPoisonerThisMatch){
        const tgtUser=S.users.find(x=>x.id===myKbmtThis.poisonTarget);

        const tgtPred=(S.predictions[myKbmtThis.poisonTarget]||{})[m.id];

          poisonGaveLine=`<span class="result-tag wrong">🍏 Táo đã trao cho ${tgtName} — bị phản đòn · -${Math.round(absPenForPoison*0.2)}đ</span>`;

      if(res&&poisonersOfThis.length){

        const myCorrect=pred&&pred.choice===res;

          poisonReceivedLine=`<span class="result-tag correct">🍏 ${names} ấn vào mồm bạn quả táo độc — Bạn nhổ vào mặt · (0 điểm)</span>`;
        } else {
          const totalDelta=base-Math.round(absPenForPoison*0.1)*poisonersOfThis.length;

      // ── Táo Nhãn Lồng: chờ chọn thưởng khi đoán đúng, tự động phạt khi đoán sai ──

/* ── LEADERBOARD ── */
function calcPointsHistory(uid){
  // Returns array of cumulative points after each FINISHED match (sorted by date)
  const pr=S.predictions[uid]||{};
  const starUsed=S.starUsed[uid]||{};
  const shUsed=(S.shieldUsed&&S.shieldUsed[uid])||{};
  const shieldCosts=(S.shieldCosts&&S.shieldCosts[uid])||{};
  const sorted=[...S.matches].filter(m=>getResult(m)!==null).sort((a,b)=>new Date(a.date)-new Date(b.date));
  let cum=0,streak=0;
  const history=[];
  sorted.forEach(m=>{
    const rnd=m.round||'g';
    const pen=PEN[rnd]||PEN.g;
    const absPen=Math.abs(pen);
    const hasStar=!!starUsed[m.id];
    const hasShield=!!shUsed[m.id];
    const starCost=Math.ceil(absPen*0.75);

    // Item costs
    if(hasShield) cum-=(shieldCosts[m.id]||shieldPrice(streak));
    if(hasStar){
      const kd2=(getKbmtData(uid))[m.id];
      if(!(kd2&&kd2.starSponsor)) cum-=starCost;
    }
    // KBMT immediate penalty
    const kd=(getKbmtData(uid))[m.id];
    if(kd&&kd.immediatePenalty) cum-=kd.immediatePenalty;

    const res=getResult(m);
    const p=pr[m.id];
    if(!p){
      streak=0;
      if(!hasShield) cum+=pen;
      history.push(cum);
      return;
    }
    const correct=p.choice===res;

    // KBMT modifier
    const kbmtR=kd?kd.result:null;
    let kbmtNoPenalty=false, kbmtExtraPts=0;
    if(kbmtR==='hoangThan'){
      if(correct) kbmtExtraPts=Math.round(absPen*0.5);
      else        kbmtNoPenalty=true;
    } else if(kbmtR==='haoQuang'){
      kbmtNoPenalty=true;
    } else if(kbmtR==='cuLua'){
      if(!correct) kbmtExtraPts=-Math.round(absPen*0.5);
    } else if(kbmtR==='quaBongCuoi'){
      if(correct) kbmtExtraPts=Math.round(absPen*0.1);
    }

    if(hasStar&&hasShield){
      if(correct){cum+=Math.round(absPen*1.5)+kbmtExtraPts;streak++;}
      else{if(!kbmtNoPenalty)cum+=pen;cum+=kbmtExtraPts;}
    } else if(hasStar){
      if(correct){cum+=Math.round(absPen*1.5)+kbmtExtraPts;streak++;}
      else{if(!kbmtNoPenalty)cum+=pen;cum+=kbmtExtraPts;streak=0;}
    } else if(hasShield){
      if(correct){cum+=kbmtExtraPts;streak++;}
      else{if(!kbmtNoPenalty)cum+=pen;cum+=kbmtExtraPts;}
    } else {
      if(correct){cum+=kbmtExtraPts;streak++;}
      else{if(!kbmtNoPenalty)cum+=pen;cum+=kbmtExtraPts;streak=0;}
    }
    if(STREAK_BONUS[streak]) cum+=STREAK_BONUS[streak];
    history.push(cum);
  });
  return history;
}

function renderLBChart(players,colors){
  // Build point history for each player
  const finishedMatches=[...S.matches].filter(m=>getResult(m)!==null).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const n=finishedMatches.length;
  if(n===0) return'<div style="text-align:center;color:var(--text4);font-size:12px;padding:20px 0">Chưa có trận nào kết thúc</div>';

  const histories=players.map(p=>calcPointsHistory(p.id));
  // All values for Y axis range
  const allVals=[0].concat(histories.flat());
  let yMin=Math.min(...allVals);
  let yMax=Math.max(...allVals);
  if(yMin===yMax){yMin-=10;yMax+=10;}
  const pad=Math.round((yMax-yMin)*0.12);
  yMin-=pad; yMax+=pad;

  const W=560,H=180,PL=46,PR=12,PT=14,PB=30;
  const cW=W-PL-PR, cH=H-PT-PB;

  const xPos=i=>PL+Math.round(i/(n-1||1)*cW);
  const yPos=v=>PT+Math.round((1-(v-yMin)/(yMax-yMin))*cH);

  // Y axis ticks
  const yTicks=[];
  const yRange=yMax-yMin;
  const step=yRange<=60?10:yRange<=200?25:yRange<=600?50:100;
  const tStart=Math.ceil(yMin/step)*step;
  for(let t=tStart;t<=yMax;t+=step) yTicks.push(t);

  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">`;
  // Background
  svg+=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`;
  // Grid lines + Y labels
  yTicks.forEach(t=>{
    const y=yPos(t);
    if(y<PT||y>PT+cH) return;
    const isZero=t===0;
    svg+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="${isZero?'rgba(255,255,255,.18)':'rgba(255,255,255,.06)'}" stroke-width="${isZero?1.5:1}" stroke-dasharray="${isZero?'':'3,4'}" vector-effect="non-scaling-stroke"/>`;
    svg+=`<text x="${PL-5}" y="${y+4}" text-anchor="end" font-size="9" fill="${isZero?'rgba(255,255,255,.5)':'rgba(255,255,255,.3)'}" font-family="Inter,sans-serif">${t}</text>`;
  });
  // X axis line
  svg+=`<line x1="${PL}" y1="${PT+cH}" x2="${W-PR}" y2="${PT+cH}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;
  // X axis label (match count)
  const xSteps=n<=10?1:n<=30?5:10;
  for(let i=0;i<n;i+=xSteps){
    const x=xPos(i);
    svg+=`<text x="${x}" y="${H-4}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.3)" font-family="Inter,sans-serif">${i+1}</text>`;
  }
  if((n-1)%xSteps!==0){
    svg+=`<text x="${xPos(n-1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.3)" font-family="Inter,sans-serif">${n}</text>`;
  }

  // Draw lines per player (back to front: lower rank first)
  players.forEach((p,pi)=>{
    const hist=histories[pi];
    if(!hist.length)return;
    const col=colors[pi]||'#8AB8F5';
    // Build path: start at 0 before any match
    const pts=[[PL,yPos(0)],...hist.map((v,i)=>[xPos(i),yPos(v)])];
    const d='M'+pts.map(([x,y])=>x+','+y).join(' L');
    const isMe=p.id===S.session;
    svg+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${isMe?2.5:1.5}" stroke-linejoin="round" stroke-linecap="round" opacity="${isMe?1:0.7}"/>`;
    // Dot at last point
    const [lx,ly]=pts[pts.length-1];
    svg+=`<circle cx="${lx}" cy="${ly}" r="${isMe?4:2.5}" fill="${col}" opacity="${isMe?1:0.8}"/>`;
  });

  svg+=`</svg>`;

  // Legend (hiển thị đầy đủ tất cả người chơi, không giới hạn 8)
  const legend=players.map((p,i)=>{
    const dn=p.displayName||p.name;
    const isMe=p.id===S.session;
    const ci=getCrownsForUser(p.id).map(c=>c.icon).join('');
    return`<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:${isMe?800:600};color:${isMe?'#fff':'rgba(255,255,255,.6)'};white-space:nowrap">
      <span style="display:inline-block;width:14px;height:3px;border-radius:2px;background:${colors[i]};opacity:${isMe?1:0.75}"></span>${ci}${dn}
    </span>`;
  }).join('');

  return`<div style="background:var(--surface2);border:1px solid var(--border1);border-radius:12px;padding:12px 14px;margin-bottom:16px">
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">📈 Biểu đồ điểm số · Trục X = lượt trận kết thúc</div>
    ${svg}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border1)">${legend}</div>
  </div>`;
}

function kbmtCounts(uid){
  const d=getKbmtData(uid);
  const counts={hoangThan:0,haoQuang:0,cuLua:0,kimBaiDorm:0,quaBongCuoi:0,quaTaoDuc:0,taoNhanLong:0};
  Object.keys(d).forEach(k=>{
    const v=d[k];
    if(v&&typeof v==='object'&&v.result&&counts.hasOwnProperty(v.result)) counts[v.result]++;
  });
  return counts;
}
