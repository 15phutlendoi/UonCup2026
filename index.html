}
function buyStar(mid){
  const u=S.users.find(x=>x.id===S.session);if(!u)return;
  const m=S.matches.find(x=>x.id===mid);
  if(!m||getStatus(m.date)!=='upcoming'){toast('Trận đã bắt đầu, không thể mua!','error');return;}
  if(!S.starUsed[u.id])S.starUsed[u.id]={};
  if(S.starUsed[u.id][mid]){toast('Đã mua Ngôi Sao cho trận này rồi','error');return;}
  // Star and shield are independent — no mutual exclusion
  const absPen=Math.abs(PEN[m.round||'g']||PEN.g);
  const cost=Math.ceil(absPen*0.75);
  const win=Math.round(absPen*1.5);
  showBuyModal({
    type:'star', mid,
    icon:'⭐',
    title:'Ngôi Sao',
    accentColor:'#F0A020',
    accentGlow:'rgba(240,160,32,.35)',
    rows:[
      {icon:'💸',label:'Chi phí mua',value:`−${cost}đ (trừ ngay lập tức)`},
      {icon:'✅',label:'Nếu đoán ĐÚNG',value:`+${win}đ (x1.5 mức phạt)`},
      {icon:'❌',label:'Nếu đoán SAI',value:`−${absPen}đ thêm (cộng dồn phạt)`},
      {icon:'🛡️',label:'Kết hợp với Khiên',value:(S.shieldUsed&&S.shieldUsed[u.id]&&S.shieldUsed[u.id][mid])?'✅ Đã mua Khiên · Nếu sai: chuỗi sẽ KHÔNG bị reset':'Chưa mua Khiên · Có thể mua thêm Khiên sau'},
      {icon:'⚠️',label:'Lưu ý quan trọng',value:'Không hoàn tiền sau khi mua · Chỉ có hiệu lực cho trận này'},
    ],
    note:`Trận: <strong>${m.team1} vs ${m.team2}</strong> · ${RND[m.round]||'Vòng Bảng'}`,
    confirmLabel:`Xác nhận mua −${cost}đ`,
    onConfirm:()=>confirmBuyStar(mid)
  });
}
function confirmBuyStar(mid){
  const u=S.users.find(x=>x.id===S.session);if(!u)return;
  const m=S.matches.find(x=>x.id===mid);if(!m)return;
  const absPen=Math.abs(PEN[m.round||'g']||PEN.g);
  const cost=Math.ceil(absPen*0.75);
  S.starUsed[u.id][mid]=true;
  saveLocal();
  fbSave('starUsed/'+u.id, S.starUsed[u.id]);
  const hasShield2=(S.shieldUsed&&S.shieldUsed[u.id]&&S.shieldUsed[u.id][mid]);
  const shieldHint=hasShield2?'':'· Bạn có thể mua thêm Khiên để bảo vệ chuỗi';
  toast(`⭐ Đã mua Ngôi Sao! −${cost}đ. Đúng: +${Math.round(absPen*1.5)}đ · Sai: −${absPen}đ thêm ${shieldHint}`,'success');render();
}

function buyShield(mid){
  const u=S.users.find(x=>x.id===S.session);if(!u)return;
  const m=S.matches.find(x=>x.id===mid);
  if(!m||getStatus(m.date)!=='upcoming'){toast('Trận đã bắt đầu, không thể mua!','error');return;}
  if(!S.shieldUsed)S.shieldUsed={};
  if(!S.shieldUsed[u.id])S.shieldUsed[u.id]={};
  if(S.shieldUsed[u.id][mid]){toast('Đã mua Khiên cho trận này rồi','error');return;}
  // Star and shield are independent — no mutual exclusion
  const streak=calcStreak(u.id);
  const cost=shieldPrice(streak);
  const tier=streak>=10?'Tier 4 (chuỗi ≥10)':streak>=7?'Tier 3 (chuỗi ≥7)':streak>=5?'Tier 2 (chuỗi ≥5)':'Tier 1 (chuỗi <5)';
  const absPen=Math.abs(PEN[m.round||'g']||PEN.g);
  showBuyModal({
    type:'shield', mid,
    icon:'🛡️',
    title:'Khiên Bảo Vệ',
    accentColor:'#6B8EE8',
    accentGlow:'rgba(107,142,232,.35)',
    rows:[
      {icon:'💸',label:'Chi phí mua',value:`−${cost}đ · ${tier}`},
      {icon:'✅',label:'Nếu đoán ĐÚNG',value:`+0đ nhưng chuỗi tăng thêm 1`},
      {icon:'❌',label:'Nếu đoán SAI',value:`−${absPen}đ như thường nhưng chuỗi KHÔNG bị reset`},
      {icon:'🔥',label:'Bảo vệ chuỗi',value:`Chuỗi hiện tại: ${streak} trận · Dùng để giữ streak quý giá`},
      {icon:'⭐',label:'Kết hợp với Ngôi Sao',value:(S.starUsed[u.id]&&S.starUsed[u.id][mid])?'✅ Đã mua Sao · Nếu đúng: nhân x1.5 điểm thưởng':'Chưa mua Sao · Có thể mua thêm Sao để tăng thưởng'},
      {icon:'⚠️',label:'Lưu ý quan trọng',value:'Không hoàn tiền sau khi mua · Chỉ có hiệu lực cho trận này'},
    ],
    note:`Trận: <strong>${m.team1} vs ${m.team2}</strong> · ${RND[m.round]||'Vòng Bảng'}`,
    confirmLabel:`Xác nhận mua −${cost}đ`,
    onConfirm:()=>confirmBuyShield(mid)
  });
}
function confirmBuyShield(mid){
  const u=S.users.find(x=>x.id===S.session);if(!u)return;
  const m=S.matches.find(x=>x.id===mid);if(!m)return;
  const streak=calcStreak(u.id);
  const cost=shieldPrice(streak);
  if(!S.shieldCosts)S.shieldCosts={};
  if(!S.shieldCosts[u.id])S.shieldCosts[u.id]={};
  S.shieldCosts[u.id][mid]=cost;
  S.shieldUsed[u.id][mid]=true;
  saveLocal();
  fbSave('shieldUsed/'+u.id, S.shieldUsed[u.id]);
  fbSave('shieldCosts/'+u.id, S.shieldCosts[u.id]);
  const tier=shieldTierName(streak);
  const hasStar2=(S.starUsed[u.id]&&S.starUsed[u.id][mid]);
  const starHint=hasStar2?'':'· Bạn có thể mua thêm Ngôi Sao để tăng thưởng';
  toast(`🛡️ Đã mua Khiên (${tier})! −${cost}đ. Sai: GIỮ chuỗi ${starHint}`,'success');render();
}

function saveHC(id){
  const m=S.matches.find(x=>x.id===id);if(!m)return;
  const v1=parseFloat(document.getElementById('h1'+id)?.value)||0;
  const v2=parseFloat(document.getElementById('h2'+id)?.value)||0;
  m.handicap1=v1;m.handicap2=v2;m.hcSaved=true;
  _fbIgnoreMatchUpdate=true;
  setTimeout(()=>{_fbIgnoreMatchUpdate=false;},3000);
  invalidateMatchCache();
  save();
  fbSaveMatches();
  toast(`💾 Lưu HC: ${m.team1} ${v1>=0?'+':''}${v1} | ${m.team2} ${v2>=0?'+':''}${v2}`,'success');render();
}
function saveRes(id){
  const m=S.matches.find(x=>x.id===id);if(!m)return;
  const s1=parseInt(document.getElementById('s1'+id)?.value);
  const s2=parseInt(document.getElementById('s2'+id)?.value);
  if(isNaN(s1)||isNaN(s2)){toast('Vui lòng nhập tỷ số hợp lệ','error');return;}
  m.score1=s1;m.score2=s2;m.status='finished';
  // ── Knockout & 90' hòa: đọc thêm KQ sau 120' (nếu ô đang hiển thị) ──
  const isKO=m.round!=='g';
  const drawn90=s1===s2;
  const et1El=document.getElementById('et1'+id);
  const et2El=document.getElementById('et2'+id);
  let et1=null, et2=null;
  if(isKO&&drawn90&&et1El&&et2El){
    const v1=parseInt(et1El.value), v2=parseInt(et2El.value);
    if(!isNaN(v1)&&!isNaN(v2)){ et1=v1; et2=v2; }
  }
  m.scoreET1=et1; m.scoreET2=et2;
  const drawn120=drawn90&&et1!==null&&et2!==null&&et1===et2;
  // Save penalty winner if knockout draw vẫn còn hòa sau 120' (hoặc chưa nhập KQ 120')
  const pwEl=document.getElementById('pw'+id);
  if(isKO&&drawn90&&(drawn120||et1===null)){
    if(pwEl) m.penWinner=pwEl.value||null;
  } else {
    m.penWinner=null; // không còn cần pen → xóa giá trị cũ tránh dữ liệu rác
  }
  // Auto-update knockout bracket display names
  applyBracketToMatches();
  invalidateMatchCache(); invalidateBracketCache(); // score/bracket changed
  // Guard: ignore the next Firebase echo to avoid overwriting what we just saved
  _fbIgnoreMatchUpdate=true;
  setTimeout(()=>{_fbIgnoreMatchUpdate=false;},3000);
  save();
  fbSaveMatches();
  updatePts();
  // Update all user points after result
  S.users.forEach(u=>{if(!u.isAdmin)u.points=calcPts(u.id);});
  saveLocal();
  toast(`✅ ${m.team1} ${s1}–${s2} ${m.team2} · Bracket & điểm đã cập nhật!`,'success');render();
}
// Write resolved bracket names into actual match records for later rounds
// CHỈ tự động điền khi (a) trận CHƯA diễn ra (chưa có tỷ số) VÀ (b) tên đội hiện tại
// vẫn còn là placeholder (vd "W M74", "W R16 #1"...). Nếu admin đã tự đặt tên đội thật
// (kể cả sửa trực tiếp trên Firebase) thì KHÔNG bao giờ ghi đè lại.
function applyBracketToMatches(){
  const bracket=resolveKnockout();
  Object.entries(bracket).forEach(([id,names])=>{
    const mid=parseInt(id);
    const m=S.matches.find(x=>x.id===mid);
    if(!m)return;
    if(m.score1===null){
      if(isPlaceholderTeamName(m.team1)&&names.team1)m.team1=names.team1;
      if(isPlaceholderTeamName(m.team2)&&names.team2)m.team2=names.team2;
    }
  });
}
function calcM(id){
  updatePts();
  S.users.forEach(u=>{if(!u.isAdmin)u.points=calcPts(u.id);});
  save();
  toast('⚡ Đã tính điểm cho tất cả người chơi!','success');render();
}
function resetRes(id){
  const m=S.matches.find(x=>x.id===id);if(!m)return;
  const name=`${m.team1} vs ${m.team2}`;
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='reset-modal';
  overlay.innerHTML=`<div class="modal-box">
    <div class="modal-icon">🔄</div>
    <div class="modal-title">Xác nhận xóa kết quả</div>
    <div class="modal-msg">Bạn có chắc muốn xóa kết quả trận<br><strong>${name}</strong>?<br><br>Điểm của tất cả người chơi cho trận này sẽ bị <strong style="color:#FCA5A5">tính lại</strong>.</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeResetModal()">Hủy</button>
      <button class="modal-btn confirm" style="background:var(--wc-orange2)" onclick="confirmResetRes(${id})">🔄 Xóa KQ</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeResetModal();});
}
function closeResetModal(){
  const el=document.getElementById('reset-modal');
  if(el)el.remove();
}
function confirmResetRes(id){
  closeResetModal();
  const m=S.matches.find(x=>x.id===id);if(!m)return;
  m.score1=null;m.score2=null;m.status='upcoming';m.penWinner=null;m.scoreET1=null;m.scoreET2=null;
  applyBracketToMatches();
  invalidateMatchCache(); invalidateBracketCache(); // score reset
  _fbIgnoreMatchUpdate=true;
  setTimeout(()=>{_fbIgnoreMatchUpdate=false;},3000);
  updatePts();
  S.users.forEach(u=>{if(!u.isAdmin)u.points=calcPts(u.id);});
  save();
  fbSaveMatches();
  toast(`🔄 Đã xóa kết quả trận ${m.team1} vs ${m.team2} · Điểm đã tính lại!`,'info');render();
}
function resetPts(uid){const u=S.users.find(x=>x.id===uid);if(u){u.points=0;S.predictions[uid]={};save();toast('🔄 Đã reset điểm','info');render();}}
function hardResetAll(){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='hr-modal';
  overlay.innerHTML=`<div class="modal-box" style="border-color:rgba(239,68,68,.6);max-width:400px">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title" style="color:#E07070;font-size:22px">XÓA TOÀN BỘ DỮ LIỆU</div>
    <div class="modal-msg">Thao tác này sẽ xóa:<br>
      <strong>• Tất cả tỷ số các trận đấu</strong><br>
      <strong>• Toàn bộ người chơi (trừ Admin)</strong><br>
      <strong>• Mọi dự đoán & điểm số</strong><br><br>
      Dữ liệu sẽ được <strong style="color:#FCA5A5">xóa vĩnh viễn</strong> khỏi server.<br>
      Gõ <code style="background:var(--surface4);padding:2px 8px;border-radius:4px;color:var(--wc-gold3)">RESET</code> để xác nhận:
    </div>
    <input type="text" id="hr-confirm-input" placeholder="Gõ RESET ở đây..." style="width:100%;padding:10px 14px;border:1.5px solid rgba(239,68,68,.4);border-radius:8px;font-size:14px;font-weight:700;color:var(--text1);background:var(--surface2);outline:none;margin-bottom:14px;text-align:center;letter-spacing:2px">
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeHrModal()">Hủy</button>
      <button class="modal-btn confirm" id="hr-confirm-btn" disabled style="opacity:.4" onclick="confirmHardReset()">🗑️ Xóa tất cả</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeHrModal();});
  // Enable confirm button only when user types RESET
  setTimeout(()=>{
    const inp=document.getElementById('hr-confirm-input');
    const btn=document.getElementById('hr-confirm-btn');
    if(inp&&btn){
      inp.addEventListener('input',()=>{
        const ok=inp.value.trim().toUpperCase()==='RESET';
        btn.disabled=!ok;
        btn.style.opacity=ok?'1':'0.4';
      });
      inp.focus();
    }
  },100);
}
function closeHrModal(){
  const el=document.getElementById('hr-modal');if(el)el.remove();
}
function confirmHardReset(){
  closeHrModal();
  // 1. Reset matches (clear all scores)
  S.matches=genMatches(); invalidateMatchCache(); invalidateBracketCache();
  // 2. Reset users to admin only
  S.users=initUsers();
  // 3. Clear all predictions, stars, session
  S.predictions={};
  S.stars={};S.shields={};
  S.starUsed={};
  S.session=null;
  S.blessings={};
  S.kbmt={};
  S.duels={};
  // 4. Clear localStorage
  Object.values(SK).forEach(k=>{ try{localStorage.removeItem(k);}catch(e){} });
  // 5. Nuke Firebase
  if(window._fb){
    const {db,ref,set}=window._fb;
    set(ref(db,'/'),{
      users:{admin:initUsers()[0]},
      predictions:{},
      matches:S.matches,
      stars:{},
      starUsed:{},
      blessings:{},
      kbmt:{},
      duels:{}
    }).catch(e=>console.warn('FB hard reset err:',e));
  }
  // 6. Reload page fresh
  toast('✅ Đã xóa toàn bộ dữ liệu. Đang tải lại...','success');
  setTimeout(()=>window.location.reload(),1200);
}
function ban(uid){
  const u=S.users.find(x=>x.id===uid);if(!u)return;
  u.status=u.status==='banned'?'active':'banned';
  if(S.session===uid&&u.status==='banned')S.session=null;
  save();toast(u.status==='banned'?'🔒 Đã khóa tài khoản':'🔓 Đã mở khóa tài khoản','info');render();
}
function deleteUser(uid,displayName){
  // Show confirm modal
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='del-modal';
  overlay.innerHTML=`<div class="modal-box">
    <div class="modal-icon">🗑️</div>
    <div class="modal-title">Xác nhận xóa</div>
    <div class="modal-msg">Bạn có chắc muốn xóa người chơi<br><strong>${displayName}</strong> không?<br><br>Thao tác này sẽ <strong style="color:#FCA5A5">xóa vĩnh viễn</strong> tài khoản và toàn bộ dự đoán của người chơi này.</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeDelModal()">Hủy</button>
      <button class="modal-btn confirm" onclick="confirmDelete('${uid}','${displayName.replace(/'/g,"\\'")}')">🗑️ Xóa ngay</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeDelModal();});
}
function closeDelModal(){
  const el=document.getElementById('del-modal');
  if(el)el.remove();
}
function confirmDelete(uid,displayName){
  closeDelModal();
  // Remove from in-memory state
  S.users=S.users.filter(x=>x.id!==uid);
  delete S.predictions[uid];
  delete S.stars[uid];
  delete S.shields[uid];
  delete S.starUsed[uid];
  if(S.blessings) delete S.blessings[uid];
  if(S.kbmt) delete S.kbmt[uid];
  if(S.duels){
    Object.keys(S.duels).forEach(id=>{
      const d=S.duels[id];
      if(d.fromUid===uid||d.toUid===uid) delete S.duels[id];
    });
  }
  // Remove from Firebase
  if(window._fb){
    const {db,ref,set}=window._fb;
    set(ref(db,'users/'+uid),null).catch(e=>console.warn('FB del user err:',e));
    set(ref(db,'predictions/'+uid),null).catch(e=>console.warn('FB del preds err:',e));
    set(ref(db,'stars/'+uid),null).catch(e=>console.warn('FB del stars err:',e));
    set(ref(db,'starUsed/'+uid),null).catch(e=>console.warn('FB del starUsed err:',e));
    fbSave('duels', S.duels||{});
  }
  saveLocal();
  toast(`🗑️ Đã xóa người chơi "${displayName}"`, 'error');
  render();
}
function adminResetPw(uid, displayName){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='rpw-modal';
  overlay.innerHTML=`<div class="modal-box">
    <div class="modal-icon">🔑</div>
    <div class="modal-title">Reset mật khẩu</div>
    <div class="modal-msg">Đặt mật khẩu mới cho người chơi<br><strong>${displayName}</strong></div>
    <div style="margin-bottom:14px">
      <div class="adm-lbl" style="margin-bottom:6px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">Mật khẩu mới</div>
      <input type="password" id="rpw-new" placeholder="Tối thiểu 6 ký tự" style="width:100%;padding:10px 14px;border:1.5px solid var(--border2);border-radius:8px;font-size:14px;font-weight:500;color:var(--text1);background:var(--surface2);outline:none;margin-bottom:8px">
      <div class="adm-lbl" style="margin-bottom:6px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">Xác nhận mật khẩu</div>
      <input type="password" id="rpw-new2" placeholder="Nhập lại mật khẩu mới" style="width:100%;padding:10px 14px;border:1.5px solid var(--border2);border-radius:8px;font-size:14px;font-weight:500;color:var(--text1);background:var(--surface2);outline:none">
    </div>
    <div id="rpw-err" class="auth-err"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeRpwModal()">Hủy</button>
      <button class="modal-btn confirm" style="background:linear-gradient(135deg,#4A7FD4,#6B9FE4);box-shadow:0 4px 14px rgba(100,150,255,.35)" onclick="confirmResetPw('${uid}','${displayName.replace(/'/g,"\\'")}')">🔑 Xác nhận</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeRpwModal();});
  setTimeout(()=>{ const el=document.getElementById('rpw-new'); if(el)el.focus(); },100);
}
function closeRpwModal(){
  const el=document.getElementById('rpw-modal');if(el)el.remove();
}
function confirmResetPw(uid, displayName){
  const np=document.getElementById('rpw-new')?.value||'';
  const np2=document.getElementById('rpw-new2')?.value||'';
  const errEl=document.getElementById('rpw-err');
  const setErr=msg=>{if(errEl){errEl.textContent=msg;errEl.className='auth-err show';}};
  if(!np||!np2){setErr('Vui lòng nhập mật khẩu mới');return;}
  if(!pwOk(np)){setErr('Mật khẩu cần ít nhất 6 ký tự');return;}
  if(np!==np2){setErr('Mật khẩu xác nhận không khớp');return;}
  const u=S.users.find(x=>x.id===uid);
  if(!u){setErr('Không tìm thấy tài khoản');return;}
  u.password=np;
  save();
  closeRpwModal();
  toast(`🔑 Đã reset mật khẩu cho "${displayName}"`, 'success');
}
function attachAuth(){
  document.querySelectorAll('input').forEach(el=>{
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){if(am==='login')doLogin();else if(am==='register')doReg();else if(am==='forgot')doForgot();}});
  });
}
render();
</script>
