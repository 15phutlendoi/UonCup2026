        ${me?`<div style="position:absolute;top:3px;right:4px;font-size:7px;font-weight:800;color:#8AB8F5;background:rgba(100,150,255,.15);border:1px solid rgba(100,150,255,.3);border-radius:6px;padding:1px 4px">Bạn</div>`:''}
        <div style="font-size:14px;line-height:1">${astroIcons[i]}</div>
        <div style="font-size:9px;font-weight:800;color:${col};letter-spacing:.3px">${astroTitles[i]}</div>
        <div style="font-size:11px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${fmtUserNameHtml(rec.p)}</div>
        <div style="font-size:9px;font-weight:700;color:${col}">✅ ${rec.cor}</div>
      </div>`;
    };

    const firstSeer=top3g[0]?seerSlot(top3g[0],0):'';
    const restSeers=top3g.slice(1).map((r,i)=>seerSlot(r,i+1)).join('');

    return`<div style="background:linear-gradient(135deg,rgba(0,30,60,.55),rgba(0,15,40,.5));border:1px solid rgba(0,160,220,.3);border-radius:13px;padding:10px 12px 9px;margin-bottom:12px;position:relative;overflow:hidden">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,160,255,.07),transparent 65%);pointer-events:none"></div>
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;position:relative">
        <span style="font-size:14px;filter:drop-shadow(0 0 5px rgba(0,200,255,.6))">🔭</span>
        <span style="font-size:10px;font-weight:900;color:rgba(0,210,255,.9);text-transform:uppercase;letter-spacing:1px;text-shadow:0 0 8px rgba(0,180,255,.4)">Tiên Tri Quyền Năng</span>
        <span style="flex:1;height:1px;background:linear-gradient(90deg,rgba(0,160,220,.35),transparent)"></span>
        <span style="font-size:9px;color:rgba(0,160,200,.5);font-weight:600">⭐ tiên tri</span>
      </div>
      <div style="padding-top:9px;margin-bottom:6px;position:relative">${firstSeer}</div>
      ${restSeers?`<div style="display:flex;gap:6px">${restSeers}</div>`:''}
    </div>`;
  })();

  // ── LÃNH TỤ TỐI CAO wrapper — gold neon ──
  const lanTuToiCaoHtml=`
  <div style="position:relative;background:linear-gradient(135deg,rgba(45,32,0,.75),rgba(30,20,0,.7));border:2px solid rgba(255,185,0,.45);border-radius:16px;padding:18px 14px 14px;margin-bottom:14px;overflow:visible;box-shadow:0 0 28px rgba(255,185,0,.18),0 0 8px rgba(255,185,0,.08)">
    <div style="position:absolute;inset:0;border-radius:15px;background:radial-gradient(ellipse at 50% 0%,rgba(255,185,0,.1),transparent 55%);pointer-events:none"></div>
    <!-- Header strip -->
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;position:relative">
      <span style="flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,185,0,.5))"></span>
      <span style="font-size:14px;filter:drop-shadow(0 0 6px rgba(255,185,0,.9))">👑</span>
      <span style="font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2.5px;color:#FFD700;text-shadow:0 0 12px rgba(255,185,0,.8),0 0 4px rgba(255,185,0,.4)">LÃNH TỤ TỐI CAO</span>
      <span style="font-size:14px;filter:drop-shadow(0 0 6px rgba(255,185,0,.9))">👑</span>
      <span style="flex:1;height:1px;background:linear-gradient(90deg,rgba(255,185,0,.5),transparent)"></span>
    </div>
    <!-- Podium -->
    <div style="background:rgba(0,0,0,.25);border:1px solid rgba(255,185,0,.15);border-radius:12px;overflow:hidden;padding:12px 10px 0;margin-bottom:10px">
      <div style="text-align:center;font-size:9px;font-weight:700;color:rgba(255,185,0,.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px">🏆 Top 3 · Bảng Vàng</div>
      ${podiumHtml}
    </div>
    <!-- Rest list -->
    ${restRows?`<div class="lb-list" style="margin-bottom:10px">${restRows}</div>`:''}
    <!-- Divider -->
    <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(255,185,0,.3),transparent);margin:0 0 10px"></div>
    <!-- Total fund inside -->
    ${totalFundHtml}
  </div>`;

  return`<div class="pg-head"><div class="pg-title">Bảng xếp hạng</div><span class="badge badge-orange">Live</span></div>
  ${lanTuToiCaoHtml}
  ${giaGatLuongHtml}
  ${warriorRankHtml}
  ${renderLBChart(sorted,chartColors)}`;
}

/* ── PROFILE ── */

function niceStep(range,targetTicks){const rough=range/targetTicks;const exp=Math.floor(Math.log10(rough));const frac=rough/Math.pow(10,exp);const nice=frac<1.5?1:frac<3.5?2:frac<7.5?5:10;return nice*Math.pow(10,exp)||10;}
function renderProfileChart(uid){
  const pr=S.predictions[uid]||{};
  const starUsed=S.starUsed[uid]||{};
  const shUsed=(S.shieldUsed&&S.shieldUsed[uid])||{};
  const shieldCosts=(S.shieldCosts&&S.shieldCosts[uid])||{};

  const ROUND_ORDER=['g','r32','r16','qf','sf','tp','f'];
  const ROUND_LABEL={g:'Bảng',r32:'V32',r16:'V16',qf:'TK',sf:'BK',tp:'H3',f:'CK'};

  // ── Per-round Japanese candlestick data ──────────────────────────────────
  // open  = cumulative points at START of round (before any match in round)
  // close = cumulative points at END of round (after all matches)
  // high  = peak cumulative during round  (best moment, captures rewards)
  // low   = trough cumulative during round (worst moment, captures penalties)
  // Each match within the round steps through purchase cost → then result delta.
  // high/low track every intermediate value so the wicks truthfully show
  // the maximum reward gained and maximum penalty absorbed in the round.

  let cum=0, runStreak=0;
  const sortedM=getSortedMatches();

  const roundData={};
  ROUND_ORDER.forEach(r=>{
    roundData[r]={open:null,close:null,high:null,low:null,
                  income:0,expense:0,matchCount:0,finishedCount:0};
  });

  sortedM.forEach(m=>{
    const rnd=m.round||'g';
    if(!roundData[rnd])return;
    const d=roundData[rnd];
    const pen=PEN[rnd]||PEN.g;
    const absPen=Math.abs(pen);
    const hasStar=starUsed[m.id];
    const hasShield=shUsed[m.id];
    d.matchCount++;

    // Snapshot open at very first match of this round
    if(d.open===null){d.open=cum;d.high=cum;d.low=cum;}

    // ── Phase 1: purchase costs (instant deduction before result) ──────────
    if(hasShield){
      const c=shieldCosts[m.id]||shieldPrice(runStreak);
      cum-=c; d.expense+=c;
      if(cum<d.low) d.low=cum;
    }
    if(hasStar){
      const c=Math.ceil(absPen*0.75);
      cum-=c; d.expense+=c;
      if(cum<d.low) d.low=cum;
    }

    // ── Phase 2: match result ─────────────────────────────────────────────
    const res=getResult(m);
    if(res){
      d.finishedCount++;
      const p=pr[m.id];
      if(!p){
        // No prediction → full penalty
        if(!hasShield){ cum+=pen; d.expense+=absPen; }
        if(!hasShield) runStreak=0;
      } else {
        const ok=p.choice===res;
        // Phần TIỀN: Sao tăng thưởng khi đúng, không ảnh hưởng khi sai (vẫn phạt thường)
        if(hasStar&&ok){ const g=Math.round(absPen*1.5); cum+=g; d.income+=g; }
        else if(!ok){ cum+=pen; d.expense+=absPen; }
        // Phần STREAK: Khiên bảo vệ chuỗi VÔ ĐIỀU KIỆN khi sai — bất kể có Sao hay không.
        // Phải kiểm tra hasShield TRƯỚC hasStar để khớp đúng calcPts/calcStreak.
        if(hasShield){
          if(ok) runStreak++;
          // sai + có khiên: streak giữ nguyên
        } else {
          if(ok) runStreak++;
          else runStreak=0;
        }
        if(ok&&STREAK_BONUS[runStreak]){
          cum+=STREAK_BONUS[runStreak]; d.income+=STREAK_BONUS[runStreak];
        }
      }
      // ── Đối đầu 1vs1 (độc lập với các luật khác) ──
      const duelC=getAcceptedDuelForUserMatch(uid,m.id);
      if(duelC){
        const amtC2=duelStakeAmounts(absPen,duelC.stake);
        const outcomeC=resolveDuelOutcome(duelC);
        if(outcomeC){
          if(outcomeC.winnerId===uid){cum+=amtC2.win;d.income+=amtC2.win;}
          else if(outcomeC.loserId===uid){cum-=amtC2.loss;d.expense+=amtC2.loss;}
        } else {
          cum-=amtC2.push; d.expense+=amtC2.push;
        }
      }
      if(cum>d.high) d.high=cum;
      if(cum<d.low)  d.low=cum;
    }
    d.close=cum;
  });

  const activeRounds=ROUND_ORDER.filter(r=>roundData[r].matchCount>0);
  if(!activeRounds.length) return'';

  // ── Rank after each round ─────────────────────────────────────────────────
  const allUsers=S.users.filter(u=>!u.isAdmin);
  const getRank=(targetUid,upToIdx)=>{
    const included=new Set(activeRounds.slice(0,upToIdx+1));
    const pts={};
    allUsers.forEach(u2=>{
      const p2=S.predictions[u2.id]||{};
      const su=S.starUsed[u2.id]||{};
      const shu=(S.shieldUsed&&S.shieldUsed[u2.id])||{};
      const shc=(S.shieldCosts&&S.shieldCosts[u2.id])||{};
      let t=0,sk=0;
      sortedM.forEach(m=>{
        const rnd2=m.round||'g';
        if(!included.has(rnd2))return;
        const pen2=PEN[rnd2]||PEN.g; const abs2=Math.abs(pen2);
        const hs=su[m.id],hsh=shu[m.id];
        if(hsh) t-=(shc[m.id]||shieldPrice(sk));
        if(hs)  t-=Math.ceil(abs2*0.75);
        const res2=getResult(m); if(!res2)return;
        const pp=p2[m.id];
        if(!pp){if(!hsh)t+=pen2; sk=0; return;}
        const ok=pp.choice===res2;
        if(hs&&ok)t+=Math.round(abs2*1.5);else if(!ok)t+=pen2;
        // Khiên giữ chuỗi vô điều kiện khi sai — kiểm tra hsh TRƯỚC, độc lập với hs (sao)
        if(hsh){if(ok)sk++;}
        else{if(ok)sk++;else sk=0;}
        if(ok&&STREAK_BONUS[sk])t+=STREAK_BONUS[sk];
        const duelR=getAcceptedDuelForUserMatch(u2.id,m.id);
        if(duelR){
          const amtR=duelStakeAmounts(abs2,duelR.stake);
          const outcomeR=resolveDuelOutcome(duelR);
          if(outcomeR){
            if(outcomeR.winnerId===u2.id)t+=amtR.win;
            else if(outcomeR.loserId===u2.id)t-=amtR.loss;
          } else {
            t-=amtR.push;
          }
        }
      });
      pts[u2.id]=t;
    });
    const s2=Object.entries(pts).sort((a,b)=>b[1]-a[1]);
    const idx=s2.findIndex(([id])=>id===targetUid);
    return idx>=0?idx+1:allUsers.length;
  };

  // ── SVG layout ────────────────────────────────────────────────────────────
  const W=380, H=260;
  const PAD={top:46,right:46,bottom:54,left:50};
  const cW=W-PAD.left-PAD.right, cH=H-PAD.top-PAD.bottom;
  const n=activeRounds.length;
  const slotW=cW/n;
  const bW=Math.max(Math.min(slotW*0.52,24),9);

  // Y scale — guarantee 0 is always visible
  let allY=[];
  activeRounds.forEach(r=>{const d=roundData[r];allY.push(d.open,d.close,d.high,d.low);});
  allY=allY.filter(v=>v!==null&&isFinite(v));
  let yLo=Math.min(...allY,0), yHi=Math.max(...allY,0);
  const yPad=(yHi-yLo)*0.22||25;
  yLo-=yPad; yHi+=yPad;
  const yS=v=>PAD.top+cH-((v-yLo)/(yHi-yLo))*cH;
  const xC=i=>PAD.left+slotW*i+slotW/2;
  const y0=yS(0);

  // Rank axis (right, inverted: rank1=top)
  const rankData=activeRounds.map((r,i)=>({rank:getRank(uid,i),x:xC(i)}));
  const maxRank=Math.max(...rankData.map(d=>d.rank),1);
  const rY=rank=>{
    if(maxRank===1)return PAD.top+cH/2;
    return PAD.top+10+((rank-1)/(maxRank-1))*(cH-20);
  };

  // Y axis ticks
  const tickStep=niceStep(yHi-yLo,5);
  const tStart=Math.ceil(yLo/tickStep)*tickStep;
  const ticks=[];
  for(let v=tStart;v<=yHi+tickStep*0.1;v+=tickStep) ticks.push(Math.round(v));

  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;overflow:visible">
  <defs>
    <linearGradient id="rpc-gp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rpc-gn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity=".13"/>
    </linearGradient>
    <filter id="rpc-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <clipPath id="rpc-clip"><rect x="${PAD.left}" y="${PAD.top-2}" width="${cW}" height="${cH+4}"/></clipPath>`;

  // Background zone fills
  const zTop=Math.max(PAD.top,Math.min(y0,PAD.top+cH));
  const zBot=Math.min(PAD.top+cH,Math.max(y0,PAD.top));
  if(zTop>PAD.top)
    svg+=`<rect x="${PAD.left}" y="${PAD.top}" width="${cW}" height="${zTop-PAD.top}" fill="url(#rpc-gp)"/>`;
  if(PAD.top+cH>zBot)
    svg+=`<rect x="${PAD.left}" y="${zBot}" width="${cW}" height="${PAD.top+cH-zBot}" fill="url(#rpc-gn)"/>`;

  // Grid + Y labels
  ticks.forEach(v=>{
    const y=yS(v); if(y<PAD.top-6||y>PAD.top+cH+6)return;
    const isZ=v===0;
    svg+=`<line x1="${PAD.left}" y1="${y}" x2="${PAD.left+cW}" y2="${y}"
      stroke="${isZ?'rgba(255,255,255,.22)':'rgba(255,255,255,.07)'}"
      stroke-width="${isZ?1:.5}" ${isZ?'':'stroke-dasharray="3,5"'}/>`;
    svg+=`<text x="${PAD.left-5}" y="${y+3.5}" text-anchor="end" font-size="8"
      fill="${isZ?'rgba(255,255,255,.55)':'rgba(255,255,255,.32)'}"
      font-weight="${isZ?700:400}" font-family="Inter,sans-serif">${v}</text>`;
  });

  // ── Japanese Candlesticks ────────────────────────────────────────────────
  // Bullish (close >= open): filled green body, green wicks
  // Bearish (close <  open): filled red body,   red wicks
  // Doji (open ≈ close):     horizontal bar
  // Upper wick = high above body → shows maximum reward/peak in round
  // Lower wick = low below body  → shows maximum penalty/trough in round
  activeRounds.forEach((r,i)=>{
    const d=roundData[r];
    if(d.open===null) return;
    const x=xC(i);
    const open=d.open, close=d.close??d.open;
    const high=Math.max(d.high??open, open, close);
    const low =Math.min(d.low ??open, open, close);
    const bull=close>=open;
    const bodyCol =bull?'#22C55E':'#EF4444';
    const wickCol =bull?'rgba(34,197,94,.75)':'rgba(239,68,68,.75)';
    const shadowCol=bull?'rgba(34,197,94,.18)':'rgba(239,68,68,.12)';

    const yO=yS(open), yC=yS(close), yH=yS(high), yL=yS(low);
    const bodyTop=Math.min(yO,yC);
    const bodyBot=Math.max(yO,yC);
    const bodyH=Math.max(bodyBot-bodyTop,3);

    // Shadow glow behind candle
    svg+=`<rect x="${x-bW/2-3}" y="${yH-3}" width="${bW+6}" height="${yL-yH+6}"
      rx="4" fill="${shadowCol}" clip-path="url(#rpc-clip)"/>`;

    // Upper wick: body-top → high
    if(yH<bodyTop-0.5)
      svg+=`<line x1="${x}" y1="${yH}" x2="${x}" y2="${bodyTop}"
        stroke="${wickCol}" stroke-width="2" stroke-linecap="round" clip-path="url(#rpc-clip)"/>`;

    // Lower wick: body-bottom → low
    if(yL>bodyBot+0.5)
      svg+=`<line x1="${x}" y1="${bodyBot}" x2="${x}" y2="${yL}"
        stroke="${wickCol}" stroke-width="2" stroke-linecap="round" clip-path="url(#rpc-clip)"/>`;

    // Candle body
    svg+=`<rect x="${x-bW/2}" y="${bodyTop}" width="${bW}" height="${bodyH}"
      rx="3" fill="${bodyCol}" fill-opacity="${bull?.85:.7}"
      stroke="${bodyCol}" stroke-width="1" clip-path="url(#rpc-clip)"/>`;

    // Doji: open ≈ close → draw a horizontal line instead
    if(Math.abs(yO-yC)<2.5){
      svg+=`<line x1="${x-bW/2-2}" y1="${yO}" x2="${x+bW/2+2}" y2="${yO}"
        stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linecap="round" clip-path="url(#rpc-clip)"/>`;
    }

    // ── Income / Expense annotations ──────────────────────────────────────
    // Shown below the lower wick with clear + / - labels
    // income (reward/bonus) → green above expense
    // expense (penalty/cost) → red below income
    const annotY=Math.max(yL,bodyBot)+10;
    if(d.income>0){
      svg+=`<text x="${x}" y="${annotY}" text-anchor="middle" font-size="7.5"
        font-weight="800" fill="#4ADE80" font-family="Inter,sans-serif">+${d.income}</text>`;
    }
    if(d.expense>0){
      svg+=`<text x="${x}" y="${annotY+(d.income>0?11:0)}" text-anchor="middle" font-size="7.5"
        font-weight="800" fill="#F87171" font-family="Inter,sans-serif">-${d.expense}</text>`;
    }
  });

  // ── Rank line (blue, right axis) ─────────────────────────────────────────
  if(rankData.length>1){
    const pts=rankData.map(d=>`${d.x},${rY(d.rank)}`).join(' ');
    svg+=`<polyline points="${pts}" fill="none" stroke="#3B82F6" stroke-width="2.2"
      stroke-linejoin="round" stroke-linecap="round" opacity=".92" filter="url(#rpc-glow)"/>`;
  }
  rankData.forEach(d=>{
    svg+=`<circle cx="${d.x}" cy="${rY(d.rank)}" r="3.8" fill="#3B82F6" stroke="#0F172A" stroke-width="1.5" filter="url(#rpc-glow)"/>`;
    svg+=`<text x="${d.x}" y="${rY(d.rank)-8}" text-anchor="middle" font-size="8" font-weight="800"
      fill="#93C5FD" font-family="Inter,sans-serif">#${d.rank}</text>`;
  });

  // Right axis: rank tick labels
  const rankTicks=[1,...(maxRank>2?[Math.round(maxRank/2)]:[]),(maxRank>1?maxRank:null)].filter(Boolean);
  rankTicks.forEach(r=>{
    svg+=`<text x="${PAD.left+cW+5}" y="${rY(r)+3}" font-size="7.5"
      fill="rgba(107,165,253,.5)" font-family="Inter,sans-serif">#${r}</text>`;
  });
  svg+=`<text x="${W-PAD.right+2}" y="${PAD.top-4}" font-size="7" fill="rgba(107,165,253,.45)"
    font-family="Inter,sans-serif" text-anchor="start">Hạng</text>`;

  // X axis: round name + net delta
  activeRounds.forEach((r,i)=>{
    const d=roundData[r];
    const x=xC(i);
    const delta=(d.close!==null&&d.open!==null)?Math.round(d.close-d.open):null;
    const dCol=delta===null?'rgba(255,255,255,.3)':delta>0?'#4ADE80':delta<0?'#F87171':'rgba(255,255,255,.45)';
    svg+=`<text x="${x}" y="${H-PAD.bottom+14}" text-anchor="middle" font-size="9.5" font-weight="700"
      fill="rgba(255,255,255,.7)" font-family="Inter,sans-serif">${ROUND_LABEL[r]}</text>`;
    if(delta!==null){
      const sign=delta>0?'+':'';
      svg+=`<text x="${x}" y="${H-PAD.bottom+27}" text-anchor="middle" font-size="8" font-weight="700"
        fill="${dCol}" font-family="Inter,sans-serif">${sign}${delta}đ</text>`;
    }
  });

  // ── Legend ───────────────────────────────────────────────────────────────
  const lx=PAD.left;
  svg+=`<rect x="${lx}" y="8" width="9" height="13" rx="1.5" fill="#22C55E" fill-opacity=".85"/>`;
  svg+=`<text x="${lx+12}" y="18" font-size="8" fill="rgba(255,255,255,.5)" font-family="Inter,sans-serif">Tăng (bull)</text>`;
  svg+=`<rect x="${lx+68}" y="8" width="9" height="13" rx="1.5" fill="#EF4444" fill-opacity=".75"/>`;
  svg+=`<text x="${lx+80}" y="18" font-size="8" fill="rgba(255,255,255,.5)" font-family="Inter,sans-serif">Giảm (bear)</text>`;
  svg+=`<line x1="${lx+150}" y1="14" x2="${lx+162}" y2="14" stroke="#3B82F6" stroke-width="2.2"/>`;
  svg+=`<circle cx="${lx+156}" cy="14" r="2.8" fill="#3B82F6"/>`;
  svg+=`<text x="${lx+166}" y="18" font-size="8" fill="rgba(255,255,255,.5)" font-family="Inter,sans-serif">Hạng BXH</text>`;

  svg+=`</svg>`;

  return`<div style="background:var(--surface1);border:1px solid var(--border1);border-radius:14px;padding:14px 10px 10px;margin-bottom:12px">
    <div style="font-size:11px;font-weight:800;color:var(--text2);letter-spacing:.4px;margin-bottom:8px;padding:0 4px">📊 Biểu đồ cá nhân</div>
    <div style="font-size:9.5px;color:var(--text4);padding:0 4px 8px;line-height:1.5">
      Nến <span style="color:#22C55E;font-weight:700">xanh</span> = vòng tăng điểm · Nến <span style="color:#EF4444;font-weight:700">đỏ</span> = vòng giảm điểm · Râu nến = đỉnh thưởng / đáy phạt · Số <span style="color:#4ADE80;font-weight:700">+</span> = thu · Số <span style="color:#F87171;font-weight:700">-</span> = chi
    </div>
    ${svg}
  </div>`;
}

function renderProfile(u){
  const pr=S.predictions[u.id]||{};
  const stars=S.stars[u.id]||{};
  const cor=Object.values(pr).filter(x=>{const m=S.matches.find(y=>y.id===x.matchId);return m&&getResult(m)===x.choice;}).length;
  const finishedCount=S.matches.filter(m=>getResult(m)!==null).length;
  const tot=Object.keys(pr).length;
  const dn=u.displayName||u.name;
  const AV_COLORS=['#F97316','#1E56E0','#22C55E','#8B5CF6','#EC4899','#F59E0B'];
  const avColor=AV_COLORS[u.id.charCodeAt(u.id.length-1)%AV_COLORS.length]||'#F97316';
  // Include ALL matches that have a result OR have a prediction
  const shieldCosts_u=(S.shieldCosts&&S.shieldCosts[u.id])||{};

  // Helper: choice label
  const choiceLabel=(choice,m2)=>choice==='win'?m2.team1+' ▲':choice==='draw'?'≡ Hòa':m2.team2+' ▲';
  // Helper: result label (what actually happened with handicap)
  const actualLabel=(res,m2)=>res==='win'?m2.team1+' ▲':res==='draw'?'≡ Hòa':res==='loss'?m2.team2+' ▲':'–';

  // ── Danh sách trận liên quan tới người chơi (đã dự đoán hoặc đã có kết quả) ──
  // Trận ĐÃ có kết quả: mới → cũ (gần nhất lên đầu)
  // Trận ĐANG CHỜ kết quả: cũ → mới (sắp đá gần nhất lên đầu)
  const histFinishedList=S.matches
    .filter(m=>(pr[m.id]||getResult(m)!==null)&&getResult(m)!==null)
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  const histPendingList=S.matches
    .filter(m=>(pr[m.id]||getResult(m)!==null)&&getResult(m)===null)
    .sort((a,b)=>new Date(a.date)-new Date(b.date));
  const histAll=[...histFinishedList,...histPendingList];
  // Tab "Tất cả": gộp chung cả 2 loại, sắp thống nhất mới → cũ
  const histAllUnifiedDesc=[...histAll].sort((a,b)=>new Date(b.date)-new Date(a.date));

  // ── Áp dụng filter trạng thái ──
  const HIST_FILTERS=[
    {k:'recent10',l:'🕐 10 trận gần nhất'},
    {k:'all',l:'Tất cả'},
    {k:'finished',l:'✅ Đã có kết quả'},
    {k:'pending',l:'⏳ Đang chờ kết quả'},
  ];
  const HIST_DEFAULT_N=10;
  const histFiltered=histFilt==='all'
    ? histAllUnifiedDesc
    : histAll.filter(m=>{
        if(histFilt==='recent10')return getResult(m)!==null;
        if(histFilt==='finished')return getResult(m)!==null;
        if(histFilt==='pending')return getResult(m)===null;
        return true;
      });

  // ── "10 trận gần nhất": luôn đúng 10 trận có kết quả gần nhất, không có nút xem thêm ──
  let histToShow=histFiltered;
  let hasMore=false;
  if(histFilt==='recent10'){
    histToShow=histFiltered.slice(0,HIST_DEFAULT_N);
  } else if(!histShowAll){
    hasMore=histFiltered.length>40;
    histToShow=histFiltered.slice(0,40);
  }

  const histCards=histToShow
    .map(m=>{
      const p=pr[m.id];
      const res=getResult(m);
      const hasStar=!!(S.starUsed[u.id]||{})[m.id];
      const hasShield=!!(S.shieldUsed&&S.shieldUsed[u.id]&&S.shieldUsed[u.id][m.id]);
      const base=PEN[m.round]||PEN.g;
      const absPen=Math.abs(base);
      const kbmtD=(getKbmtData(u.id))[m.id];
      const kbmtR=kbmtD?kbmtD.result:null;
      const isStarSponsored=!!(kbmtD&&kbmtD.starSponsor);
      const immPen=kbmtD&&kbmtD.immediatePenalty?kbmtD.immediatePenalty:0;
      const starCost=hasStar&&!isStarSponsored?Math.ceil(absPen*0.75):0;
      const shCost=hasShield?(shieldCosts_u[m.id]||shieldPrice(0)):0;
      const dStr=new Date(m.date).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
      // Đối đầu 1vs1 cho trận này (nếu có)
      const matchDuel=getAcceptedDuelForUserMatch(u.id,m.id);
      let duelDelta=0,duelTagHtml='';
      if(matchDuel){
        const oppId=matchDuel.fromUid===u.id?matchDuel.toUid:matchDuel.fromUid;
        const opp=S.users.find(x=>x.id===oppId);
        const oppCrownIcons=opp?getCrownsForUser(opp.id).map(c=>c.icon).join(''):'';
        const oppName=opp?`${oppCrownIcons}${opp.displayName||opp.name}`:'?';
        const amtH=duelStakeAmounts(absPen,matchDuel.stake);
        const stakeTag=`${matchDuel.stake||DUEL_STAKE_DEFAULT}%`;
        const outcome=res?resolveDuelOutcome(matchDuel):null;
        if(outcome){
          if(outcome.winnerId===u.id){duelDelta=amtH.win;duelTagHtml=`<span class="hg-item-tag" style="color:#4ADE80;border-color:rgba(34,197,94,.35)">⚔️ Thắng đối đầu ${oppName} (${stakeTag}, +${duelDelta}đ)</span>`;}
          else{duelDelta=-amtH.loss;duelTagHtml=`<span class="hg-item-tag" style="color:#FCA5A5;border-color:rgba(239,68,68,.3)">⚔️ Thua đối đầu ${oppName} (${stakeTag}, ${duelDelta}đ)</span>`;}
        } else if(res){
          duelDelta=-amtH.push;
          duelTagHtml=`<span class="hg-item-tag" style="color:#FCA5A5;border-color:rgba(239,68,68,.3)">⚔️ Đối đầu ${oppName} hòa kèo (${stakeTag}, cả 2 sai, ${duelDelta}đ)</span>`;
        } else {
          duelTagHtml=`<span class="hg-item-tag" style="color:#FCD34D;border-color:rgba(240,160,0,.3)">⚔️ Đối đầu ${oppName} (${stakeTag}, chờ KQ)</span>`;
        }
      }

      // KBMT modifiers on match result
      let kbmtNoPenalty=false, kbmtExtraPts=0;
      if(kbmtR==='hoangThan') { /* applied below based on correct */ }
      else if(kbmtR==='haoQuang') { kbmtNoPenalty=true; }
      else if(kbmtR==='cuLua') { /* applied below based on correct */ }

      // ── Táo Độc: 2 chiều độc lập, có thể xảy ra ĐỒNG THỜI trong cùng 1 trận ──
      // Chiều 1: u là kẻ TRAO táo cho ai đó (1 trận chỉ trao cho đúng 1 người)
      const isPoisonerThis=kbmtR==='quaTaoDuc'&&kbmtD&&kbmtD.poisonTarget;
      // Chiều 2: u là NẠN NHÂN bị (có thể nhiều) người khác trao táo trong trận này
      const poisonersOfMe=res?getPoisoners(u.id,m.id):(getPoisoners(u.id,m.id));
      let poisonerCaughtDelta=0; // áp dụng khi u là kẻ trao táo và bị phản đòn
      let poisonVictimDelta=0;   // áp dụng khi u là nạn nhân (đoán sai → trừ thêm 10% mỗi quả)
      let poisonGaveTagHtml='';   // dòng: Táo đã trao cho X
      let poisonReceivedTagHtml=''; // dòng: Y, Z ấn vào mồm bạn quả táo độc
      // ── Chiều 1: u trao táo cho ai ──
      if(isPoisonerThis){
        const tgtUser=S.users.find(x=>x.id===kbmtD.poisonTarget);
        const tgtName=tgtUser?(tgtUser.displayName||tgtUser.name):'?';
        if(res){
          const tgtPred=(S.predictions[kbmtD.poisonTarget]||{})[m.id];
          const tgtCorrect=!!(tgtPred&&tgtPred.choice===res);
          if(tgtCorrect){
            poisonerCaughtDelta=-Math.round(absPen*0.2);
            poisonGaveTagHtml=`<span class="hg-item-tag" style="color:#FCA5A5;border-color:rgba(239,68,68,.4);font-weight:700">🍏 Táo đã trao cho ${tgtName} — bị phản đòn · ${poisonerCaughtDelta}đ</span>`;
          } else {
            poisonGaveTagHtml=`<span class="hg-item-tag" style="color:#86EFAC;border-color:rgba(34,197,94,.35);font-weight:700">🍏 Táo đã trao cho ${tgtName} — ${tgtName} bị ngộ độc · (0 điểm)</span>`;
          }
        } else {
          poisonGaveTagHtml=`<span class="hg-item-tag" style="color:#FCD34D;border-color:rgba(240,160,0,.3)">🍏 Táo đã trao cho ${tgtName} — chờ kết quả</span>`;
        }
      }
      // ── Chiều 2: u bị (các) ai trao táo ──
      if(poisonersOfMe.length){
        const names=poisonersOfMe.map(pi=>{
          const pu=S.users.find(x=>x.id===pi.poisonerId);
          return pu?(pu.displayName||pu.name):'?';
        }).join(', ');
        if(res){
          const myOk=p&&p.choice===res;
          if(myOk){
            poisonReceivedTagHtml=`<span class="hg-item-tag" style="color:#86EFAC;border-color:rgba(34,197,94,.35);font-weight:700">🍏 ${names} ấn vào mồm bạn quả táo độc — Bạn nhổ vào mặt · (0 điểm)</span>`;
          } else {
            poisonVictimDelta=-Math.round(absPen*0.1)*poisonersOfMe.length;
            poisonReceivedTagHtml=`<span class="hg-item-tag" style="color:#FCA5A5;border-color:rgba(239,68,68,.4);font-weight:700">🍏 ${names} ấn vào mồm bạn quả táo độc — Ngộ độc toàn thân · ${poisonVictimDelta}đ</span>`;
          }
        } else {
          poisonReceivedTagHtml=`<span class="hg-item-tag" style="color:#FCD34D;border-color:rgba(240,160,0,.3)">🍏 ${names} đã trao táo độc cho bạn — chờ kết quả</span>`;
        }
      }

      // Determine card state
      let cardState='pending';
      let net=null;
      let ok=false;


      if(res){
        if(!p){
          cardState='missed';
          net=-shCost-starCost-immPen+(hasShield?0:base)+duelDelta+poisonerCaughtDelta+poisonVictimDelta;
        } else {
          ok=p.choice===res;
          // Đoán sai nhưng có Khiên bảo vệ → trạng thái riêng 'shielded' (KHÔNG phải 'wrong')
          // để hiển thị rõ ràng là chuỗi đúng KHÔNG bị mất, khác với thua bình thường.
          cardState=ok?'correct':(hasShield?'shielded':'wrong');
          // Recompute KBMT modifiers now we know correct/wrong
          let kNoPen=kbmtNoPenalty, kExtra=0;
          if(kbmtR==='hoangThan'){
            if(ok) kExtra=Math.round(absPen*0.5);
            else   kNoPen=true;
          } else if(kbmtR==='cuLua'){
            if(!ok) kExtra=-Math.round(absPen*0.5);
          } else if(kbmtR==='quaBongCuoi'){
            if(ok) kExtra=Math.round(absPen*0.1);
          }
          let resultDelta;
          if(hasStar){
            resultDelta=ok?Math.round(absPen*1.5):(!kNoPen?base:0);
          } else {
            resultDelta=ok?0:(!kNoPen?base:0);
          }
          net=-starCost-shCost-immPen+resultDelta+kExtra+duelDelta+poisonerCaughtDelta+poisonVictimDelta;
        }
      }

      // Net display (điểm cuối — hiển thị to, rõ ràng)
      let ptsBoxHtml='';
      if(net===null){
        const costSoFar=-(starCost+shCost+immPen);
        if(costSoFar<0) ptsBoxHtml=`<div class="hr-pts-box pend"><div class="hr-pts-num pend">${costSoFar}đ</div><div class="hr-pts-lbl">⏳ Chờ KQ</div></div>`;
        else ptsBoxHtml=`<div class="hr-pts-box pend"><div class="hr-pts-num pend">⏳</div><div class="hr-pts-lbl">Chờ KQ</div></div>`;
      } else {
        const cls=net>0?'pos':net<0?'neg':'zero';
        const sign=net>0?'+':'';
        ptsBoxHtml=`<div class="hr-pts-box ${cls}"><div class="hr-pts-num ${cls}">${sign}${net}đ</div><div class="hr-pts-lbl">Điểm trận</div></div>`;
      }

      // Score display (tỷ số trận đấu)
      let scoreHtml='';
      if(m.score1!==null&&m.score1!==undefined&&m.score2!==null&&m.score2!==undefined){
        scoreHtml=`<div class="hr-score"><div class="hr-score-num">${m.score1} - ${m.score2}</div><div class="hr-score-lbl">Tỷ số</div></div>`;
      } else {
        scoreHtml=`<div class="hr-score"><div class="hr-score-num pend">⏳</div><div class="hr-score-lbl">Chưa đá</div></div>`;
      }

      // Purchase tags (các chức năng/vật phẩm người chơi đã dùng trong trận)
      const kbmtResMap={hoangThan:'👑 Hoàng Thân',haoQuang:'🎆 NV Chính',cuLua:'💀 Kỳ Nghỉ',taiTro:'⭐ Tài Trợ',kimBaiDorm:'🔩 Đồng Nát',quaBongCuoi:'🎈 Bóng Cười',quaTaoDuc:'🍏 Táo Độc',taoNhanLong:'🍎 Nhãn Lồng'};
      const itemTags=[
        hasStar?(isStarSponsored?`<span class="hg-item-tag" style="color:#4ADE80;border-color:rgba(34,197,94,.35)">⭐ Miễn phí (Tài Trợ Sao)</span>`:`<span class="hg-item-tag">⭐ −${Math.ceil(absPen*0.75)}đ</span>`):'',
        hasShield?(cardState==='shielded'?`<span class="hg-item-tag" style="color:#A5B4FC;border-color:rgba(99,102,241,.45);font-weight:700">🛡️ −${shCost}đ · Chuỗi vẫn giữ ✓</span>`:`<span class="hg-item-tag">🛡️ −${shCost}đ</span>`):'',
        (kbmtR&&!isPoisonerThis)?(immPen>0?`<span class="hg-item-tag" style="color:#FCA5A5;border-color:rgba(239,68,68,.3)">${kbmtResMap[kbmtR]||kbmtR} (−${immPen}đ ngay)</span>`
                       :`<span class="hg-item-tag" style="color:#FCD34D;border-color:rgba(240,160,0,.3)">${kbmtResMap[kbmtR]||kbmtR}</span>`):'',
        poisonGaveTagHtml,
        poisonReceivedTagHtml,
        duelTagHtml,
      ].filter(Boolean).join('');

      // User's choice chip (lựa chọn của người chơi)
      let userChipHtml='';
      if(!p){
        userChipHtml=`<span class="hg-choice-chip hg-chip-none">Không chọn</span>`;
      } else {
        const chipCls=res?(ok?'hg-chip-correct':'hg-chip-wrong'):'hg-chip-pending';
        userChipHtml=`<span class="hg-choice-chip ${chipCls}">${choiceLabel(p.choice,m)}</span>`;
      }

      // Actual result chip (lựa chọn đúng / kết quả thực tế)
      let actualChipHtml='';
      if(res){
        actualChipHtml=`<span class="hg-choice-chip hg-chip-actual">${actualLabel(res,m)}</span>`;
      } else {
        actualChipHtml=`<span class="hg-choice-chip hg-chip-none">Chưa có</span>`;
      }

      return`<div class="hr-row hg-${cardState}">
        <div class="hr-meta">
          <div class="hr-matchup">${m.team1}<span class="hr-vs">vs</span>${m.team2}</div>
          <div class="hr-date"><span class="hg-round-badge">${RND[m.round]}</span> ${dStr}</div>
        </div>
        ${scoreHtml}
        <div class="hr-choices">
          <div class="hr-row2"><span class="hg-label">Đúng</span>${actualChipHtml}</div>
          <div class="hr-row2"><span class="hg-label">Bạn chọn</span>${userChipHtml}</div>
        </div>
        <div class="hr-items">${itemTags||'<span class="empty-tag">— Không dùng chức năng —</span>'}</div>
        ${ptsBoxHtml}
      </div>`;
    }).join('');

  const histFilterBar=`<div class="dd-bar" style="margin-bottom:10px">
    ${HIST_FILTERS.map(f=>`<button class="nav-btn ${histFilt===f.k?'active':''}" style="font-size:11px;padding:6px 12px" onclick="setHistFilt('${f.k}')">${f.l}</button>`).join('')}
  </div>`;

  const histLoadMoreHtml=hasMore?`<button class="hist-loadmore" onclick="toggleHistShowAll()">⬇️ Xem thêm (${histFiltered.length-histToShow.length} trận)</button>`:
    (histFilt!=='recent10'&&histShowAll&&histFiltered.length>40?`<button class="hist-loadmore" onclick="toggleHistShowAll()">⬆️ Thu gọn</button>`:'');

  const hist=(histFilterBar)+(histCards?`<div class="hist-list">${histCards}</div>${histLoadMoreHtml}`:'<div class="empty-state">Chưa có dự đoán nào</div>');
  // Build per-round summary for honeycomb
  const ROUND_ORDER_P=['g','r32','r16','qf','sf','tp','f'];
  const ROUND_EMOJI={g:'⚽',r32:'🏟️',r16:'⚡',qf:'🔥',sf:'💥',tp:'🥉',f:'🏆'};
  const ROUND_SHORT={g:'Bảng',r32:'V32',r16:'V16',qf:'TK',sf:'BK',tp:'H3',f:'CK'};
  const roundSummary={};
  ROUND_ORDER_P.forEach(rnd=>{
    const rMatches=S.matches.filter(m=>m.round===rnd);
    if(!rMatches.length) return;
    let pts=0,corr=0,total_p=0,pending=false;
    rMatches.forEach(m=>{
      const p2=pr[m.id];
      const res2=getResult(m);
      const hasStar2=!!(S.starUsed[u.id]||{})[m.id];
      const hasShield2=!!(S.shieldUsed&&S.shieldUsed[u.id]&&S.shieldUsed[u.id][m.id]);
      const shCosts2=(S.shieldCosts&&S.shieldCosts[u.id])||{};
      const base2=PEN[rnd]||PEN.g;
      const absPen2=Math.abs(base2);
      const kd2=(getKbmtData(u.id))[m.id];
      const kbmtR2=kd2?kd2.result:null;
      const isStarSponsored2=!!(kd2&&kd2.starSponsor);
      const immPen2=kd2&&kd2.immediatePenalty?kd2.immediatePenalty:0;
      if(hasShield2) pts-=(shCosts2[m.id]||shieldPrice(0));
      if(hasStar2&&!isStarSponsored2) pts-=Math.ceil(absPen2*0.75);
      if(immPen2) pts-=immPen2;
      if(!res2){pending=true;return;}
      if(!p2){pts+=base2;return;}
      total_p++;
      const ok2=p2.choice===res2;
      // KBMT modifier
      let kNoPen2=false, kExtra2=0;
      if(kbmtR2==='hoangThan'){if(ok2)kExtra2=Math.round(absPen2*0.5);else kNoPen2=true;}
      else if(kbmtR2==='haoQuang'){kNoPen2=true;}
      else if(kbmtR2==='cuLua'&&!ok2){kExtra2=-Math.round(absPen2*0.5);}
      if(ok2){
        corr++;
        if(hasStar2) pts+=Math.round(absPen2*1.5);
        pts+=kExtra2;
      } else {
        if(!kNoPen2) pts+=base2;
        pts+=kExtra2;
      }
      // ── Đối đầu 1vs1 (độc lập với các luật khác) ──
      const duel2=getAcceptedDuelForUserMatch(u.id,m.id);
      if(duel2){
        const amt2=duelStakeAmounts(absPen2,duel2.stake);
        const outcome2=resolveDuelOutcome(duel2);
        if(outcome2){
          if(outcome2.winnerId===u.id) pts+=amt2.win;
          else if(outcome2.loserId===u.id) pts-=amt2.loss;
        } else {
          pts-=amt2.push;
        }
      }
    });
    roundSummary[rnd]={pts,corr,total:rMatches.filter(m=>getResult(m)!==null).length,pending,matchCount:rMatches.length};
  });

  const hexCells=ROUND_ORDER_P.map(rnd=>{
    const rs=roundSummary[rnd];
    if(!rs) return'';
    const positive=rs.pts>0;
    const neutral=rs.pts===0&&rs.total===0;
    const hasData=rs.total>0||rs.pts!==0;
    const bgColor=neutral||!hasData?'rgba(255,255,255,.04)':positive?'rgba(34,197,94,.12)':'rgba(239,68,68,.1)';
    const borderColor=neutral||!hasData?'rgba(255,255,255,.1)':positive?'rgba(34,197,94,.3)':'rgba(239,68,68,.3)';
    const ptsColor=neutral||!hasData?'var(--text4)':positive?'#4ADE80':'#F87171';
    const ptsDisplay=!hasData?'–':rs.pts===0?'±0':(rs.pts>0?'+':'')+rs.pts+'đ';
    return`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 6px;background:${bgColor};border:1.5px solid ${borderColor};border-radius:14px;min-width:0;cursor:default;transition:all .2s" title="${RND[rnd]}">
      <div style="font-size:${rnd==='f'?'20px':'16px'}">${ROUND_EMOJI[rnd]}</div>
      <div style="font-size:10px;font-weight:800;color:var(--text3);letter-spacing:.3px">${ROUND_SHORT[rnd]}</div>
      <div style="font-size:13px;font-weight:900;color:${ptsColor};line-height:1">${ptsDisplay}</div>
      <div style="font-size:9px;color:var(--text4);font-weight:600">${hasData?rs.corr+'/'+rs.matchCount:'0/'+rs.matchCount}</div>
      ${rs.pending?`<div style="font-size:8px;color:#FBB040;font-weight:700">chờ</div>`:''}
    </div>`;
  }).join('');

  const itemStatsHtml = (()=>{
    // ── Helper: compute star/shield breakdown for one uid ──
    function itemStats(uid){
      const starU=S.starUsed[uid]||{};
      const shU=(S.shieldUsed&&S.shieldUsed[uid])||{};
      const shCosts=(S.shieldCosts&&S.shieldCosts[uid])||{};
      const predU=S.predictions[uid]||{};
      let star={total:0,correct:0,wrong:0,pending:0};
      let shield={total:0,savedStreak:0,normal:0,pending:0};
      let kbmt={total:0,pending:0,resolved:0};
      const kbmtResults={hoangThan:0,haoQuang:0,cuLua:0,taiTro:0,kimBaiDorm:0,quaBongCuoi:0,quaTaoDuc:0,taoNhanLong:0};
      S.matches.forEach(m=>{
        const res=getResult(m);
        const p=predU[m.id];
        const ok=p&&res?p.choice===res:null;
        if(starU[m.id]){
          star.total++;
          if(res===null) star.pending++;
          else if(ok) star.correct++;
          else star.wrong++;
        }
        if(shU[m.id]){
          shield.total++;
          if(res===null) shield.pending++;
          else if(!ok) shield.savedStreak++; // used shield on a wrong answer = streak saved
          else shield.normal++;
        }
        const kd=(getKbmtData(uid))[m.id];
        if(kd&&kd.result){
          // ✅ Đếm cả trận chưa diễn ra (kd.result được gán ngay lúc quay gacha,
          // không phụ thuộc vào việc trận đã có kết quả hay chưa)
          kbmt.total++;
          if(res===null) kbmt.pending++;
          else kbmt.resolved++;
          if(kbmtResults[kd.result]!==undefined) kbmtResults[kd.result]++;
        }
      });
      return{star,shield,kbmt,kbmtResults};
    }

    const my=itemStats(u.id);

    // ── Global across all non-admin users ──
    const allPlayers=S.users.filter(x=>!x.isAdmin);
    const g={star:{total:0,correct:0,wrong:0,pending:0},shield:{total:0,savedStreak:0,normal:0,pending:0},kbmt:{total:0,pending:0,resolved:0}};
    const gKbmtResults={hoangThan:0,haoQuang:0,cuLua:0,taiTro:0,kimBaiDorm:0,quaBongCuoi:0,quaTaoDuc:0,taoNhanLong:0};
    allPlayers.forEach(pl=>{
      const s=itemStats(pl.id);
      g.star.total+=s.star.total; g.star.correct+=s.star.correct; g.star.wrong+=s.star.wrong; g.star.pending+=s.star.pending;
      g.shield.total+=s.shield.total; g.shield.savedStreak+=s.shield.savedStreak; g.shield.normal+=s.shield.normal; g.shield.pending+=s.shield.pending;
      g.kbmt.total+=s.kbmt.total; g.kbmt.pending+=s.kbmt.pending; g.kbmt.resolved+=s.kbmt.resolved;
      Object.keys(gKbmtResults).forEach(k=>gKbmtResults[k]+=s.kbmtResults[k]||0);
    });

    const kbmtNames={hoangThan:'👑 Hoàng Thân',haoQuang:'🎆 NV Chính',cuLua:'💀 Kỳ Nghỉ',taiTro:'⭐ Tài Trợ',kimBaiDorm:'🔩 Đồng Nát',quaBongCuoi:'🎈 Bóng Cười',quaTaoDuc:'🍏 Táo Độc',taoNhanLong:'🍎 Nhãn Lồng'};
    const kbmtColors={hoangThan:'#FCD34D',haoQuang:'#4ADE80',cuLua:'#FCA5A5',taiTro:'#FCD34D',kimBaiDorm:'#9CA3AF',quaBongCuoi:'#67E8F9',quaTaoDuc:'#86EFAC',taoNhanLong:'#DDD6FE'};

    // ── Mini breakdown tag ──
    const tag=(label,val,col)=>val>0?`<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:10px;font-weight:700;color:${col}">${label}: ${val}</span>`:'';

    // ── Progress bar ──
    const bar=(a,b,colA,colB)=>{
      const tot=a+b; if(!tot) return'';
      const pct=Math.round(a/tot*100);
      return`<div style="height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px">
        <div style="height:100%;width:${pct}%;background:${colA};border-radius:3px;transition:width .4s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text4);margin-top:2px"><span style="color:${colA}">${pct}% đúng</span><span style="color:${colB}">${100-pct}% sai</span></div>`;
    };

    // ── Item card builder ──
    const itemCard=(emoji,label,total,bdHtml,accentBg,accentBorder,accentColor,big=false)=>
      `<div style="background:${accentBg};border:${big?'1.5':'1'}px solid ${accentBorder};border-radius:11px;padding:${big?'11px 10px':'9px 8px'}">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px">
          <span style="font-size:${big?'18':'15'}px">${emoji}</span>
          <span style="font-size:${big?'11':'10'}px;font-weight:800;color:${accentColor};text-transform:uppercase;letter-spacing:.4px">${label}</span>
          <span style="margin-left:auto;font-size:${big?'20':'17'}px;font-weight:900;color:${accentColor};line-height:1">${total}</span>
        </div>
        ${bdHtml}
      </div>`;

    // ── My star breakdown ──
    const myStarBd=my.star.total?`
      ${bar(my.star.correct,my.star.wrong,'#4ADE80','#F87171')}
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">
        ${tag('✅ Đúng',my.star.correct,'#4ADE80')}
        ${tag('❌ Sai',my.star.wrong,'#F87171')}
        ${tag('⏳ Chờ',my.star.pending,'#FBB040')}
      </div>`:`<div style="font-size:10px;color:var(--text4)">Chưa dùng</div>`;

    // ── My shield breakdown ──
    const myShBd=my.shield.total?`
      ${bar(my.shield.savedStreak,my.shield.normal,'#60A5FA','#A5B4FC')}
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">
        ${tag('🛡️ Cứu chuỗi',my.shield.savedStreak,'#60A5FA')}
        ${tag('✅ Trận đúng',my.shield.normal,'#A5B4FC')}
        ${tag('⏳ Chờ',my.shield.pending,'#FBB040')}
      </div>`:`<div style="font-size:10px;color:var(--text4)">Chưa dùng</div>`;

    // ── My kbmt breakdown ──
    const myKbmtBd=my.kbmt.total
      ?`<div style="display:flex;flex-wrap:wrap;gap:4px">${Object.entries(my.kbmtResults).filter(([,v])=>v>0).map(([k,v])=>tag(kbmtNames[k],v,kbmtColors[k])).join('')}${tag('⏳ Chờ',my.kbmt.pending,'#FBB040')}</div>`
      :`<div style="font-size:10px;color:var(--text4)">Chưa dùng</div>`;

    // ── Global breakdowns ──
    const gStarBd=g.star.total?`
      ${bar(g.star.correct,g.star.wrong,'#4ADE80','#F87171')}
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:5px">
        ${tag('✅ Đúng',g.star.correct,'#4ADE80')}
        ${tag('❌ Sai',g.star.wrong,'#F87171')}
        ${tag('⏳ Chờ',g.star.pending,'#FBB040')}
      </div>`:`<div style="font-size:10px;color:var(--text4)">Chưa có dữ liệu</div>`;

    const gShBd=g.shield.total?`
      ${bar(g.shield.savedStreak,g.shield.normal,'#60A5FA','#A5B4FC')}
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:5px">
        ${tag('🛡️ Cứu chuỗi',g.shield.savedStreak,'#60A5FA')}
        ${tag('✅ Trận đúng',g.shield.normal,'#A5B4FC')}
        ${tag('⏳ Chờ',g.shield.pending,'#FBB040')}
      </div>`:`<div style="font-size:10px;color:var(--text4)">Chưa có dữ liệu</div>`;

    const gKbmtBd=g.kbmt.total
      ?`<div style="display:flex;flex-wrap:wrap;gap:4px">${Object.entries(gKbmtResults).filter(([,v])=>v>0).map(([k,v])=>tag(kbmtNames[k],v,kbmtColors[k])).join('')}${tag('⏳ Chờ',g.kbmt.pending,'#FBB040')}</div>`
      :`<div style="font-size:10px;color:var(--text4)">Chưa có dữ liệu</div>`;

    return`<div style="background:var(--surface1);border:1px solid var(--border1);border-radius:14px;padding:14px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:800;color:var(--text2);letter-spacing:.4px;margin-bottom:12px">🎒 Thống kê vật phẩm đã sử dụng</div>

      <div style="font-size:10px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Của bạn</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        ${itemCard('⭐','Ngôi Sao',my.star.total,myStarBd,'linear-gradient(135deg,rgba(217,119,6,.12),rgba(245,158,11,.06))','rgba(245,158,11,.3)','#FCD34D',true)}
        ${itemCard('🛡️','Khiên',my.shield.total,myShBd,'linear-gradient(135deg,rgba(79,70,229,.12),rgba(99,102,241,.06))','rgba(99,102,241,.3)','#A5B4FC',true)}
        ${itemCard('👑','Kim Bài',my.kbmt.total,myKbmtBd,'linear-gradient(135deg,rgba(180,130,0,.12),rgba(240,160,0,.06))','rgba(240,160,0,.3)','#FCD34D',true)}
      </div>

      <div style="border-top:1px solid var(--border1);padding-top:12px">
        <div style="font-size:10px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Toàn server · ${allPlayers.length} người chơi</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
          ${itemCard('⭐','Ngôi Sao',g.star.total,gStarBd,'rgba(245,158,11,.06)','rgba(245,158,11,.15)','#FCD34D')}
          ${itemCard('🛡️','Khiên',g.shield.total,gShBd,'rgba(99,102,241,.06)','rgba(99,102,241,.15)','#A5B4FC')}
          ${itemCard('👑','Kim Bài',g.kbmt.total,gKbmtBd,'rgba(240,160,0,.06)','rgba(240,160,0,.15)','#FCD34D')}
        </div>
      </div>
    </div>`;
  })();

  const statsBlockHtml = `<div class="stat-grid">
    <div class="stat-card"><div class="stat-v">${tot}</div><div class="stat-l">Đã đặt cược</div></div>
    <div class="stat-card"><div class="stat-v">${cor}</div><div class="stat-l">Đúng</div></div>
    <div class="stat-card"><div class="stat-v">${finishedCount>0?Math.round(cor/finishedCount*100):0}%</div><div class="stat-l">Chính xác</div></div>
    <div class="stat-card" style="background:linear-gradient(135deg,rgba(249,115,22,.1),rgba(234,88,12,.06));border-color:rgba(249,115,22,.25)"><div class="stat-v" style="color:#FB923C">🔥${calcStreak(u.id)}</div><div class="stat-l">Chuỗi hiện tại</div></div>
    ${(()=>{const dr=calcDuelRecord(u.id);return`<div class="stat-card" style="background:linear-gradient(135deg,rgba(220,38,38,.1),rgba(239,68,68,.06));border-color:rgba(239,68,68,.25)"><div class="stat-v" style="color:#FCA5A5">⚔️${dr.wins}–${dr.losses}${dr.pushes?` <span style="font-size:11px;color:var(--text4)">(${dr.pushes} hòa)</span>`:''}</div><div class="stat-l">Đối đầu 1vs1 (T–B)</div></div>`;})()}
  </div>
  <div style="background:var(--surface1);border:1px solid var(--border1);border-radius:14px;padding:14px;margin-bottom:14px">
    <div style="font-size:11px;font-weight:800;color:var(--text2);letter-spacing:.4px;margin-bottom:10px">🗺️ Toàn giải đấu · Điểm theo vòng</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">
      ${hexCells}
    </div>
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border1);display:flex;gap:12px;font-size:10px;font-weight:600;color:var(--text4)">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:3px;background:rgba(34,197,94,.2);border:1px solid rgba(34,197,94,.3);display:inline-block"></span>Vòng tăng điểm</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:3px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);display:inline-block"></span>Vòng giảm điểm</span>
      <span style="color:var(--text4)">Số ô = đúng/tổng trận</span>
    </div>
  </div>
  <div class="info-box" style="flex-direction:column;gap:3px;margin-bottom:6px">
    <div style="font-weight:800;font-size:12px">🔥 Thưởng chuỗi trả lời đúng</div>
    <div style="font-size:11px;color:var(--text3)">
      ${calcStreak(u.id)>=30?'✅':'⬜'} 30 trận liên tiếp → <strong style="color:#FCD34D">+500đ</strong> &nbsp;
      ${calcStreak(u.id)>=25?'✅':'⬜'} 25 trận → <strong style="color:#FCD34D">+400đ</strong> &nbsp;
      ${calcStreak(u.id)>=20?'✅':'⬜'} 20 trận → <strong style="color:#FCD34D">+300đ</strong> &nbsp;
      ${calcStreak(u.id)>=15?'✅':'⬜'} 15 trận → <strong style="color:#FCD34D">+200đ</strong> &nbsp;
      ${calcStreak(u.id)>=10?'✅':'⬜'} 10 trận → <strong style="color:#FCD34D">+150đ</strong> &nbsp;
      ${calcStreak(u.id)>=5?'✅':'⬜'} 5 trận → <strong style="color:#FCD34D">+50đ</strong>
    </div>
    <div style="font-size:11px;color:var(--text4)">Tier Khiên hiện tại: ${shieldTierLabel(calcStreak(u.id))}</div>
  </div>`;

  return`<div class="prof-hero">
    <div class="prof-av" style="background:${avColor}">${fmtUserAvatarChar(u,dn[0].toUpperCase())}</div>
    <div class="prof-info">
      <div class="prof-dn">${fmtUserNameHtml(u)}</div>
      <div class="prof-real">${u.name}</div>
      <div class="prof-email">✉️ ${u.email}</div>
    </div>
    ${!u.isAdmin?`<div class="prof-pts-chip">${u.points} điểm</div>`:''}
  </div>
  ${!u.isAdmin?itemStatsHtml:''}
  <div class="pg-head"><div class="pg-title">Lịch sử dự đoán</div></div>
  ${hist}
  ${!u.isAdmin?statsBlockHtml:''}`;
}

/* ── SHOP ── */
function renderShop(u){
  const starCount=Object.values(S.starUsed[u.id]||{}).filter(Boolean).length;
  const shCount=Object.values((S.shieldUsed&&S.shieldUsed[u.id])||{}).filter(Boolean).length;
  const blessingActive=isBlessingActive(u.id);
  const lossStreak=calcLossStreak(u.id);
  const canActivateBlessing=lossStreak>=BLESSING_LOSS_STREAK_THRESHOLD&&!blessingActive;

  // ── Shield: chọn trận để mua trực tiếp trong Shop ──
  // Chỉ cho phép mua khiên cho 5 trận SẮP DIỄN RA GẦN NHẤT (chưa tới giờ thi đấu),
  // đã được admin lưu tỷ lệ chấp (hcSaved), và chưa mua khiên cho trận đó.
  const shieldUsedMap=(S.shieldUsed&&S.shieldUsed[u.id])||{};
  const upcomingForShield=[...S.matches]
    .filter(m=>getStatus(m.date)==='upcoming'&&m.hcSaved&&!shieldUsedMap[m.id])
    .sort((a,b)=>new Date(a.date)-new Date(b.date))
    .slice(0,5);
  const curStreakShop=calcStreak(u.id);
  const shopShieldCost=shieldPrice(curStreakShop);
  const shopShieldTier=`${shieldTierName(curStreakShop)} (chuỗi hiện tại: ${curStreakShop})`;
  const shieldMatchOptions=upcomingForShield.map(m=>`<option value="${m.id}">${m.team1} vs ${m.team2} · ${RND[m.round]||'Vòng Bảng'}</option>`).join('');

  const shieldCardHtml=`
    <div class="shop-card" style="border-color:rgba(99,102,241,.35)">
      <div class="shop-icon">🛡️</div>
      <div class="shop-name">Khiên Bảo Kê</div>
      <div class="shop-desc">
        🛡️ Bảo vệ chuỗi đúng của bạn!<br>
        💸 <strong>Tier 1</strong> (chuỗi 0–4): <strong style="color:#FCA5A5">−10đ</strong><br>
        💸 <strong>Tier 2</strong> (chuỗi 5–6): <strong style="color:#FCA5A5">−15đ</strong><br>
        💸 <strong>Tier 3</strong> (chuỗi 7–9): <strong style="color:#FCA5A5">−30đ</strong><br>
        💸 <strong>Tier 4</strong> (chuỗi 10+): <strong style="color:#FCA5A5">−45đ</strong><br>
        ✅ Đoán <strong>đúng</strong> → +0đ, <strong style="color:#86EFAC">chuỗi +1</strong>, khiên bị hủy<br>
        ❌ Đoán <strong>sai</strong> → trừ điểm bình thường, nhưng <strong style="color:#86EFAC">chuỗi được giữ nguyên!</strong>
      </div>
      ${upcomingForShield.length===0
        ?`<div class="shop-price" style="font-size:13px;font-weight:700;color:var(--text3)">Không có trận sắp tới để mua Khiên</div>
           <button class="shop-btn" style="opacity:.4;cursor:not-allowed" disabled>Chưa có trận khả dụng</button>`
        :`<select id="shop-shield-match" style="width:100%;padding:9px 12px;border:1.5px solid rgba(99,102,241,.4);border-radius:8px;background:var(--surface2);color:var(--text1);font-size:12px;font-weight:600;margin-bottom:10px;outline:none">
            ${shieldMatchOptions}
          </select>
          <div class="shop-price" style="font-size:13px;font-weight:700;color:#A5B4FC">−${shopShieldCost}đ · ${shopShieldTier}</div>
          <button class="shop-btn" style="background:linear-gradient(135deg,rgba(79,70,229,.25),rgba(99,102,241,.15));border-color:rgba(99,102,241,.5);color:#A5B4FC;font-weight:800" onclick="buyShield(parseInt(document.getElementById('shop-shield-match').value,10))">🛡️ Mua Khiên trận này</button>`
      }
    </div>`;

  const blessingCardHtml=`
    <div class="shop-card blessing-shop-card" style="${blessingActive?'border-color:rgba(160,80,255,.5);box-shadow:0 0 20px rgba(140,60,240,.15)':''}">
      <div class="shop-icon" style="filter:${blessingActive?'drop-shadow(0 0 12px rgba(180,80,255,.8))':'none'};font-size:38px">🌙</div>
      <div class="shop-name" style="background:linear-gradient(135deg,#C084FC,#A855F7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Phước Lành Huyền Bí</div>
      <div class="shop-desc">
        ${blessingActive
          ?`<div style="display:flex;align-items:center;justify-content:center;margin-bottom:10px"><span class="blessing-active-badge">✨ Phước lành đang hiệu lực</span></div>`
          :''}
        🛡️ Kích hoạt khi có <strong style="color:#C084FC">chuỗi thua ≥ 5</strong>.<br>
        📉 Nếu tiếp tục thua → <strong style="color:#86EFAC">giảm 30%</strong> điểm bị trừ mỗi trận.<br>
        ⚡ Hiệu lực đúng <strong>1 trận tiếp theo</strong> — tự hóa giải bất kể thắng hay thua.<br>
        <br><span style="font-size:11px;color:rgba(160,120,220,.7)">Phước lành tự động hiện qua pop-up khi đủ điều kiện. Chuỗi thua hiện tại: <strong style="color:#FCA5A5">${lossStreak} trận</strong></span>
      </div>
      <div class="shop-price" style="font-size:13px;font-weight:700;color:${lossStreak>=BLESSING_LOSS_STREAK_THRESHOLD?'#C084FC':'var(--text3)'}">
        ${blessingActive?'✨ Đang hiệu lực':lossStreak>=BLESSING_LOSS_STREAK_THRESHOLD?`🔓 Đủ điều kiện kích hoạt (thua ${lossStreak} trận)`:`🔒 Cần chuỗi thua ≥ ${BLESSING_LOSS_STREAK_THRESHOLD} (hiện: ${lossStreak})`}
      </div>
      ${canActivateBlessing
        ?`<button class="shop-btn" style="background:linear-gradient(135deg,rgba(120,40,200,.25),rgba(160,80,255,.15));border-color:rgba(160,80,255,.5);color:#C084FC;font-weight:800" onclick="acceptBlessing('${u.id}')">🙏 Xin ban phước lành</button>`
        :blessingActive
          ?`<button class="shop-btn" style="opacity:.6;cursor:default;border-color:rgba(160,80,255,.3);color:#C084FC" disabled>✨ Phước lành đang che chở bạn</button>`
          :`<button class="shop-btn" style="opacity:.4;cursor:not-allowed" disabled>🔒 Chưa đủ điều kiện</button>`
      }
    </div>`;

  return`<div class="pg-head"><div class="pg-title">Shop đặc biệt</div><span class="badge badge-gold">WC2026</span></div>
  <div class="info-box" style="flex-direction:column;gap:4px">
    <div>Đã mua: <span class="star-count">⭐ ${starCount} Ngôi Sao</span> · <span class="star-count" style="background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.25);color:#A5B4FC">🛡️ ${shCount} Khiên</span>${blessingActive?` · <span class="star-count" style="background:rgba(120,40,200,.12);border-color:rgba(160,80,255,.3);color:#C084FC">🌙 Phước Lành đang hiệu lực</span>`:''}</div>
    <div style="font-size:11px;color:var(--text4)">⭐ Ngôi Sao mua trực tiếp tại từng trận trong Lịch thi đấu · 🛡️ Khiên mua tại Shop · Giá tự động theo điểm phạt / chuỗi hiện tại</div>

    const kd=getKbmtData(uid);
    const entries=Object.entries(kd).filter(([k,v])=>k!=='banUntilMatchId'&&k!=='banUntilMatch'&&k!=='fleeCount'&&v&&v.result);
    if(!entries.length) return '';
    const KNAME={hoangThan:'👑 Hoàng Thân',haoQuang:'🎆 NV Chính',cuLua:'💀 Kỳ Nghỉ',taiTro:'⭐ Tài Trợ',kimBaiDorm:'🔩 Đồng Nát',quaBongCuoi:'🎈 Bóng Cười',quaTaoDuc:'🍏 Táo Độc',taoNhanLong:'🍎 Nhãn Lồng'};
    const tags=entries.map(([midStr,v])=>{
      const mid=parseInt(midStr,10);
      const m=S.matches.find(x=>x.id===mid);
      if(!m) return '';
      const st=getStatus(m.date);
      const label=KNAME[v.result]||v.result;
      const matchShort=`${m.team1} vs ${m.team2}`;
      let extra='';
      if(v.result==='quaTaoDuc'){
        if(v.poisonTarget){
          const tu=S.users.find(x=>x.id===v.poisonTarget);
          const tn=tu?(tu.displayName||tu.name):'?';
          extra=` → <span style="color:#86EFAC;font-weight:800">🎯 ${tn}</span>`;
          // Nút đổi nạn nhân chỉ khi trận chưa diễn ra
          if(st==='upcoming'){
            extra+=` <button onclick="adminRedirectPoisonPick('${uid}',${mid})" style="font-size:9px;padding:2px 7px;border-radius:6px;border:1px solid rgba(34,197,94,.5);background:rgba(34,197,94,.08);color:#86EFAC;cursor:pointer;font-weight:800;margin-left:2px">Đổi</button>`;
          }
        } else {
          extra=` → <span style="color:rgba(134,239,172,.45);font-style:italic">Chưa chọn nạn nhân</span>`;
          if(st==='upcoming'){
            extra+=` <button onclick="adminRedirectPoisonPick('${uid}',${mid})" style="font-size:9px;padding:2px 7px;border-radius:6px;border:1px solid rgba(34,197,94,.5);background:rgba(34,197,94,.08);color:#86EFAC;cursor:pointer;font-weight:800;margin-left:2px">Chọn</button>`;
          }

      }
      const stCol=st==='upcoming'?'rgba(100,150,255,.7)':st==='live'?'rgba(245,158,11,.8)':'rgba(100,100,100,.5)';
      const stLbl=st==='upcoming'?'⏳ Sắp đá':st==='live'?'🔴 Live':'✅ Xong';
      return`<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)">
        <span style="font-size:10px;font-weight:700;color:rgba(255,220,130,.8)">${label}</span>
        <span style="font-size:9px;color:var(--text4)">·</span>
        <span style="font-size:9px;color:var(--text3);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${matchShort}</span>
        <span style="font-size:9px;font-weight:700;color:${stCol}">${stLbl}</span>
        ${extra}
      </div>`;
    }).filter(Boolean).join('');
    if(!tags) return '';
    return`<div style="margin-top:5px;padding:6px 8px;background:rgba(240,160,0,.05);border:1px solid rgba(240,160,0,.15);border-radius:7px;display:flex;flex-direction:column;gap:0">
      <div style="font-size:9px;font-weight:800;color:rgba(240,160,0,.6);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">👑 Kim Bài đã dùng</div>
      ${tags}
    </div>`;
  }

  const uRows=players.map(u=>`<div class="user-row">
    <div class="user-av">${fmtUserAvatarChar(u,(u.displayName||u.name)[0].toUpperCase())}</div>
    <div style="flex:1;min-width:0">
      <div class="user-dn">${fmtUserNameHtml(u)}</div>
      <div class="user-email">${u.name} · ${u.email}</div>
      ${buildKbmtSummary(u.id)}
    </div>
    <span class="sc ${u.status==='active'?'sc-active':'sc-banned'}">${u.status==='active'?'Hoạt động':'Bị khóa'}</span>
    <div class="user-pts">${u.points}đ</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <button class="u-btn" onclick="resetPts('${u.id}')">Reset điểm</button>
      <button class="u-btn" style="border-color:rgba(100,150,255,.35);color:#8AB8F5" onclick="adminResetPw('${u.id}','${(u.displayName||u.name).replace(/'/g,"\\'")}')">🔑 Reset MK</button>
      <button class="u-btn danger" onclick="ban('${u.id}')">${u.status==='banned'?'Mở khóa':'Khóa'}</button>
      <button class="u-btn delete" onclick="deleteUser('${u.id}','${(u.displayName||u.name).replace(/'/g,"\\'")}')">🗑️ Xóa</button>
    </div>
  </div>`).join('');

  // ── Admin match filter ──
  const ADML=[
    {k:'all',l:'🗂️ Tất cả'},
    {k:'entered',l:'✅ Đã nhập KQ'},
    {k:'pending',l:'⏳ Chưa nhập KQ'},
    {k:'g',l:'⚽ Vòng Bảng'},
    {k:'r32',l:'🏟️ Vòng 32'},
    {k:'r16',l:'⚡ Vòng 16'},
    {k:'qf',l:'🔥 Tứ Kết'},
    {k:'sf',l:'💥 Bán Kết'},
    {k:'tp',l:'🥉 Hạng Ba'},
    {k:'f',l:'🏆 Chung Kết'},
  ];
  const admFilterBar=ADML.map(f=>`<button class="ftab ${admfilt===f.k?'active':''}" onclick="sadmf('${f.k}')">${f.l}</button>`).join('');

  // ── Filter matches ──
  let filteredMatches=S.matches.filter(m=>{
    if(admfilt==='all') return true;
    if(admfilt==='entered') return m.score1!==null&&m.score2!==null;
    if(admfilt==='pending') return m.score1===null||m.score2===null;
    return m.round===admfilt;
  });

  // Count stats
  const total=S.matches.length;
  const entered=S.matches.filter(m=>m.score1!==null&&m.score2!==null).length;
  const pending=total-entered;

  const bracket=getBracket();
  const mRows=filteredMatches.map(m=>{
    const d=new Date(m.date);
    const ds=d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
    const res=getResult(m);
    const rChip=res?`<span class="rc ${res==='win'?'rc-win':res==='draw'?'rc-draw':'rc-loss'}">${res==='win'?m.team1+' thắng':res==='draw'?'Hòa':m.team2+' thắng'}</span>`:'';
    // Display bracket-resolved names for knockout matches
    const dn1=getMatchTeam(m,1,bracket);
    const dn2=getMatchTeam(m,2,bracket);
    const isDone=m.score1!==null&&m.score2!==null;
    const cardBorder=isDone?'border-left:3px solid var(--wc-green);':'border-left:3px solid var(--surface4);';
    // Round scoring info
    const rnd=m.round||'g';
    const scoringInfo=`+${PTS_OK[rnd]||PTS_OK.g}đ đúng / ${PEN[rnd]||PEN.g}đ sai`;
    // ── Knockout: 90' hòa → cần KQ 120'; nếu 120' cũng hòa → cần Pen thắng ──
    const isKO=m.round!=='g';
    const drawn90=isDone&&Number(m.score1)===Number(m.score2);
    const et1=m.scoreET1, et2=m.scoreET2;
    const hasET=et1!==null&&et1!==undefined&&et2!==null&&et2!==undefined;
    const drawn120=drawn90&&hasET&&Number(et1)===Number(et2);
    const needPen=drawn90&&(!hasET||drawn120);
    return`<div class="amr" style="${cardBorder}">
      <div style="flex:1;min-width:140px">
        <div class="amr-name"><span class="${CC[m.team1]||''}" style="font-weight:800">${dn1}</span> vs <span class="${CC[m.team2]||''}" style="font-weight:800">${dn2}</span></div>
        <div class="amr-meta">${ds} · ${RND[m.round]}${m.group&&!['r32','r16','qf','sf','tp','f'].includes(m.round)?' · Bảng '+m.group:''} ${rChip}</div>
        <div style="font-size:10px;color:var(--text4);margin-top:3px">🏅 ${scoringInfo}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <div><div class="adm-lbl">HC đội 1</div><input class="ai" type="number" step="0.5" id="h1${m.id}" value="${m.handicap1}"></div>
        <div><div class="adm-lbl">HC đội 2</div><input class="ai" type="number" step="0.5" id="h2${m.id}" value="${m.handicap2}"></div>
        <button class="abtn abtn-save" onclick="saveHC(${m.id})" style="${m.hcSaved?'border-color:rgba(34,197,94,.4);color:#4ADE80':''}">${m.hcSaved?'✅ HC':'💾 HC'}</button>
        <div class="sep-v"></div>
        <div><div class="adm-lbl">Tỷ số chính thức (90')</div>
          <div class="score-pair">
            <input class="ai" type="number" id="s1${m.id}" value="${m.score1!==null?m.score1:''}" placeholder="Đ1" style="width:44px">
            <span style="color:var(--text4);font-weight:700;padding:0 3px">–</span>
            <input class="ai" type="number" id="s2${m.id}" value="${m.score2!==null?m.score2:''}" placeholder="Đ2" style="width:44px">
          </div>
        </div>
        ${isKO&&drawn90?`<div><div class="adm-lbl">KQ sau 120'</div>
          <div class="score-pair">
            <input class="ai" type="number" id="et1${m.id}" value="${et1!==null&&et1!==undefined?et1:''}" placeholder="Đ1" style="width:44px">
            <span style="color:var(--text4);font-weight:700;padding:0 3px">–</span>
            <input class="ai" type="number" id="et2${m.id}" value="${et2!==null&&et2!==undefined?et2:''}" placeholder="Đ2" style="width:44px">
          </div>
        </div>`:''}
        ${isKO&&needPen?`<div><div class="adm-lbl">Pen thắng</div>
          <select class="ai" id="pw${m.id}" style="width:90px;padding:5px 4px">
            <option value="">N/A</option>
            <option value="${m.team1}" ${m.penWinner===m.team1?'selected':''}>${dn1}</option>
            <option value="${m.team2}" ${m.penWinner===m.team2?'selected':''}>${dn2}</option>
          </select></div>`:''}
        <button class="abtn abtn-res" onclick="saveRes(${m.id})">✅ Lưu KQ</button>
        ${isDone?`<button class="abtn abtn-calc" onclick="calcM(${m.id})">⚡ Tính điểm</button><button class="abtn abtn-reset" onclick="resetRes(${m.id})">🔄 Xóa KQ</button>`:''}
      </div>
    </div>`;
  }).join('');

  return`<div class="pg-head"><div class="pg-title">Admin Panel</div><span class="badge badge-blue">Quản trị</span>
  <button onclick="hardResetAll()" style="margin-left:auto;padding:7px 15px;background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.35);border-radius:8px;cursor:pointer;font-size:12px;font-weight:800;color:#FCA5A5;transition:all .15s" onmouseover="this.style.background='rgba(239,68,68,.25)'" onmouseout="this.style.background='rgba(239,68,68,.12)'">⚠️ Hard Reset</button>
  </div>
  <div class="adm-section">
    <div class="adm-stitle" style="cursor:pointer;user-select:none" onclick="toggleAdmUsers()">
      <span>👥 Người chơi (${players.length})</span>
      <span id="adm-users-toggle-icon" style="margin-left:auto;font-size:13px;color:var(--text3);transition:transform .2s">${window._admUsersOpen===false?'▶':'▼'}</span>
    </div>
    <div id="adm-users-body" style="display:${window._admUsersOpen===false?'none':'block'}">
      ${uRows||'<div class="empty-state">Chưa có người chơi</div>'}
    </div>
  </div>
  <div class="adm-section">
    <div class="adm-stitle">⚽ Quản lý Kết quả & Điểm</div>
    <div class="info-box" style="flex-direction:column;gap:6px">
      <div>📊 <strong>Tiến độ nhập kết quả:</strong> <span style="color:var(--wc-green)">${entered} trận đã có KQ</span> · <span style="color:var(--wc-orange)">${pending} trận chờ nhập</span> / ${total} tổng trận</div>
      <div>🏅 <strong>Hệ thống tính điểm FIFA WC2026:</strong> Vòng bảng (+${PTS_OK.g}/${PEN.g}) · Vòng 32 (+${PTS_OK.r32}/${PEN.r32}) · Vòng 16 (+${PTS_OK.r16}/${PEN.r16}) · Tứ kết (+${PTS_OK.qf}/${PEN.qf}) · Bán kết (+${PTS_OK.sf}/${PEN.sf}) · Chung kết (+${PTS_OK.f}/${PEN.f})</div>
      <div>🔗 Bracket tự động cập nhật khi lưu kết quả. Nhấn "Tính điểm" để cộng điểm ngay sau khi lưu KQ.</div>
      <div>🏟️ <strong>Vòng knockout (từ vòng 32):</strong> nếu 90' hòa, lưu KQ 90' trước → ô "KQ sau 120'" sẽ hiện ra để nhập tiếp. Nếu 120' cũng hòa, lưu lần nữa → ô "Pen thắng" sẽ hiện để chọn đội đi tiếp. Tỷ lệ chấp/điểm dự đoán luôn tính theo tỷ số 90'.</div>
    </div>
    <div class="fbar" style="margin-bottom:12px">${admFilterBar}</div>
    <div style="font-size:11px;color:var(--text4);margin-bottom:10px">Hiển thị ${filteredMatches.length} trận</div>
    ${mRows||'<div class="empty-state">Không có trận nào phù hợp bộ lọc</div>'}
  </div>`;
}

function gp(p){page=p;filt='all';grp='all';sfilt=p==='matches'?'upcoming':'all';if(p==='profile'){histFilt='recent10';histShowAll=false;}render();}
function sf2(f){filt=f;grp='all';render();}
function sg(g){grp=g;filt=g==='all'?'all':'g';render();}
function ssf(s){sfilt=s;render();}

// Guard chống double-click: chặn gọi pred() 2 lần trong vòng 500ms
let _predCooldown=false;
function pred(mid,choice){
  if(_predCooldown)return;
  _predCooldown=true; setTimeout(()=>{_predCooldown=false;},500);
  const u=S.users.find(x=>x.id===S.session);if(!u||u.isAdmin)return;
  const m=S.matches.find(x=>x.id===mid);
  if(!m||getStatus(m.date)!=='upcoming'){toast('Trận đấu đã bắt đầu, không thể đặt!','error');return;}
  const lockDuel=getUserDuel(u.id,mid);
  if(lockDuel&&lockDuel.status==='accepted'){toast('🔒 Thách đấu 1vs1 đã được chấp nhận — không thể đổi lựa chọn ở trận này!','error');return;}
  if(!S.predictions[u.id])S.predictions[u.id]={};
  S.predictions[u.id][mid]={choice,matchId:mid,time:new Date().toISOString()};
  saveLocal();
  // Guard: bỏ qua echo Firebase trong 2s để tránh listener ghi đè lại state vừa lưu
  _fbIgnorePredUpdate=true;
  setTimeout(()=>{_fbIgnorePredUpdate=false;},2000);
  // Write only this user's predictions to Firebase immediately
  fbSave('predictions/'+u.id, S.predictions[u.id]);
  const lbl=choice==='win'?m.team1+' thắng':choice==='draw'?'Hòa':m.team2+' thắng';
  toast('✅ Đã chọn: '+lbl,'success');render();
}
function showBuyModal({type,mid,icon,title,accentColor,accentGlow,rows,note,confirmLabel,onConfirm}){

      <div style="flex:1;min-width:0">

  ov.innerHTML=`
    <div style="background:#111828;border:1.5px solid ${accentColor}55;border-radius:18px;padding:0;max-width:360px;width:100%;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 24px 60px rgba(0,0,0,.55),0 0 40px ${accentGlow};overflow:hidden;animation:slideUp .22s ease">
      <!-- Header -->
      <div style="background:linear-gradient(135deg,${accentColor}18 0%,transparent 100%);padding:20px 20px 14px;text-align:center;border-bottom:1px solid ${accentColor}33">
        <div style="font-size:40px;line-height:1;margin-bottom:8px">${icon}</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2.5px;color:${accentColor};text-shadow:0 0 16px ${accentGlow}">${title}</div>
        <div style="font-size:11px;color:rgba(255,255,255,.45);margin-top:4px;font-weight:600">${note}</div>

        <span style="font-size:14px">🚫</span>
        <span style="font-size:11px;font-weight:700;color:#F87171;line-height:1.4">Không hoàn tiền sau khi xác nhận mua. Chỉ có hiệu lực cho trận này.</span>
      </div>
      <!-- Buttons -->
      <div style="display:flex;gap:8px;padding:0 18px 18px">
        <button onclick="closeBuyModal()" style="flex:1;padding:12px;border-radius:10px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border:1.5px solid rgba(255,255,255,.12);font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.3px;transition:all .18s" onmouseover="this.style.background='rgba(255,255,255,.1)'" onmouseout="this.style.background='rgba(255,255,255,.06)'">✕ Đóng</button>
        <button onclick="document.getElementById('buy-modal-overlay')._onConfirm&&document.getElementById('buy-modal-overlay')._onConfirm();closeBuyModal();" style="flex:2;padding:12px;border-radius:10px;background:linear-gradient(135deg,${accentColor}dd,${accentColor});color:#fff;border:none;font-size:12.5px;font-weight:900;cursor:pointer;letter-spacing:.3px;box-shadow:0 4px 16px ${accentGlow};transition:all .18s" onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 6px 20px ${accentGlow}'" onmouseout="this.style.transform='none';this.style.boxShadow='0 4px 16px ${accentGlow}'">${confirmLabel}</button>

  const el=document.getElementById('buy-modal-overlay');
